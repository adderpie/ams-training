<style>
/* tokens:start */
/* AMS Johnston Coaching client app: design tokens. Source of truth for every colour, size, radius, elevation and
   motion value in the app. Index.html uses these custom properties and never raw values.
   Brand (July 2026): forest #1F7A36, emerald #2BA84A, charcoal #222222, off-white #F2F2F2, burgundy #6B2D34.
   Type: Montserrat (brand header face from the sheet design language), Arial fallback. Numbers always tabular.
   Contrast: every pair below checked with design/contrast.js (WCAG AA 4.5:1 text, 3:1 large). */

:root {
  /* Brand */
  --forest: #1F7A36;
  --emerald: #2BA84A;
  --charcoal: #222222;
  --offwhite: #F2F2F2;
  --burgundy: #6B2D34;

  /* Light theme (default) */
  --canvas: var(--offwhite);        /* page */
  --surface: #FFFFFF;               /* cards, inputs */
  --surface-2: #E6EAE6;             /* pressed, strips, track */
  --line: #D6DBD6;                  /* hairlines */
  --ink: var(--charcoal);           /* text 14.6:1 on canvas */
  --ink-muted: #5E665E;             /* secondary text 5.3:1 */
  --ink-faint: #9AA29A;             /* placeholders, disabled (not for reading) */
  --accent: var(--forest);          /* working colour: links, selected, text accents 4.8:1 */
  --accent-strong: var(--emerald);  /* fills, rings, progress; never text on light */
  --on-accent: var(--offwhite);     /* text on forest 4.8:1 */
  --on-accent-strong: #062611;      /* text on emerald 5.3:1 */
  --coach: var(--burgundy);         /* Adam's voice, alerts, warnings 9.2:1 */
  --on-coach: var(--offwhite);
  --warn: #8A5A00;                  /* pending sync, amber on light 5.6:1 */
  --focus: var(--emerald);

  /* Type: Montserrat, one family, weight does the work */
  --font: "Montserrat", Arial, Helvetica, sans-serif;
  --fs-12: 12px;  /* meta */
  --fs-14: 14px;  /* labels, secondary */
  --fs-16: 16px;  /* body, inputs */
  --fs-20: 20px;  /* card titles */
  --fs-24: 24px;  /* screen titles */
  --fs-32: 32px;  /* key numbers */
  --fs-44: 44px;  /* hero numbers */
  --fs-64: 64px;  /* the one big number */
  --lh-tight: 1.1;
  --lh-body: 1.45;
  --w-regular: 500;
  --w-bold: 700;
  --w-black: 800;
  --track-tight: -0.02em;

  /* 8pt spacing */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --gutter: 16px;                   /* side gutter at 375px */
  --tap: 48px;                      /* minimum hit target */

  /* Radius: hierarchy, not one value everywhere */
  --r-chip: 6px;                    /* chips, small inputs */
  --r-card: 12px;                   /* cards, number fields */
  --r-sheet: 20px;                  /* bottom sheets, top corners */
  --r-pill: 999px;                  /* buttons, toggles */

  /* Elevation: light uses one hairline and one sheet shadow; nothing else floats */
  --elev-0: none;
  --elev-1: 0 0 0 1px var(--line);
  --elev-2: 0 8px 24px rgba(34, 34, 34, 0.12);   /* bottom sheets and the dock only */

  /* Depth and light: one gradient (emerald to forest, never purple) for the rings, one glow for the ring and the primary action.
     The gradient never sits under text: dark ink on the forest end is 3.0:1. */
  --accent-grad: linear-gradient(135deg, #2BA84A 0%, #1F7A36 100%);
  --glow: 0 0 28px rgba(43, 168, 74, 0.45);
  --glow-soft: 0 0 60px rgba(43, 168, 74, 0.18);

  /* Chart lines: up to eight series on one chart; each is readable as a chip label on its theme's surface (4.5:1 checked) */
  --chart-1: var(--forest);
  --chart-2: #8A5A00;
  --chart-3: #1F5FA8;
  --chart-4: #6B3FB5;
  --chart-5: #B8332F;
  --chart-6: #0E7A63;
  --chart-7: #7A5A00;
  --chart-8: #A3256E;

  /* Motion: one easing family, four durations */
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --t-micro: 160ms;                 /* taps, ticks, toggles, chips */
  --t-screen: 300ms;                /* screen and sheet transitions */
  --t-draw: 600ms;                  /* chart draw-in, ring fill */
  --t-hero: 1100ms;                 /* the ring and number on Today, the success moment */
}

/* Dark theme: charcoal is the canvas, emerald becomes readable text, burgundy needs a tint */
:root[data-theme="dark"], [data-theme="dark"] {
  --canvas: #1A1C1A;
  --surface: var(--charcoal);       /* 14.6:1 with off-white */
  --surface-2: #282B28;            /* kept dark enough for emerald text 4.7:1 */
  --line: #3A3E3A;
  --ink: var(--offwhite);
  --ink-muted: #A9B0A9;             /* 7.4:1 */
  --ink-faint: #6E756E;
  --accent: var(--emerald);         /* 5.3:1 on charcoal, usable as text */
  --accent-strong: var(--emerald);
  --on-accent: #062611;
  --on-accent-strong: #062611;
  --coach: #E8A9B1;                 /* burgundy tint 8.9:1; raw #6B2D34 fails on dark */
  --on-coach: var(--charcoal);
  --warn: #E8C15A;                  /* 9.3:1 */
  --chart-1: var(--emerald);
  --chart-2: #F2B134;
  --chart-3: #5FB0F0;
  --chart-4: #B48BF2;
  --chart-5: #F27A7A;
  --chart-6: #5FD8B8;
  --chart-7: #E8D55C;
  --chart-8: #EE9FD0;
  --elev-1: 0 0 0 1px var(--line);
  --elev-2: 0 -1px 0 var(--line);   /* no shadows in the dark: tone does the lifting */
}

@media (prefers-reduced-motion: reduce) {
  :root { --t-micro: 0ms; --t-screen: 0ms; --t-draw: 0ms; --t-hero: 0ms; }
}
/* tokens:end */
/* ember colours for the Today hero, rgb triplets: read by its keyframes and its canvas */
:root { --ember: 43, 168, 74; --amber: 255, 170, 90; } /* embers (the web uses --ember too) */

/* ---------- base ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--canvas); color: var(--ink); }
/* App-style scrolling: the page never scrolls; body is a full-screen panel that does. The phone's browser bar never
   slides in and out (that caused a flash on scroll-up), no rubber-band past the ends, scroll bars hidden. */
html { height: 100%; overflow: hidden; }
body { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: none; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
#app { overflow-x: hidden; overflow-wrap: anywhere; }
#web { position: fixed; inset: 0; z-index: 0; pointer-events: none; } /* the particle web, under everything */
#app { position: relative; z-index: 1; }
* { scrollbar-width: none; }
*::-webkit-scrollbar { display: none; width: 0; height: 0; }
body { font: var(--w-regular) var(--fs-16)/var(--lh-body) var(--font); font-variant-numeric: tabular-nums; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
::selection { background: var(--accent-strong); color: var(--on-accent-strong); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-chip); }
a { color: inherit; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { max-width: 520px; margin: 0 auto; padding: 0 var(--gutter); }
#app { padding-top: var(--s-3); padding-bottom: calc(110px + env(safe-area-inset-bottom)); min-height: 100vh; }
#app.in-session { padding-bottom: calc(180px + env(safe-area-inset-bottom)); }

/* ---------- motion: one easing, three durations, every tap answers ---------- */
.screen { animation: screen-in var(--t-screen) var(--ease) both; }
.screen.sub { animation-name: sheet-in; }
@keyframes screen-in { from { opacity: 0; transform: translateX(22px); } }
@keyframes sheet-in { from { opacity: 0; transform: translateY(28px) scale(.985); } }
@keyframes pop { from { transform: scale(.6); opacity: .4; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
@keyframes halo { from { r: 5; opacity: .7; } to { r: 18; opacity: 0; } }
@keyframes glowpulse { 0%, 100% { filter: drop-shadow(0 0 10px rgba(43, 168, 74, .35)); } 50% { filter: drop-shadow(0 0 26px rgba(43, 168, 74, .65)); } }
/* ambient light: a soft emerald wash behind the Today hero, nowhere else */
#app.today-bg { background: radial-gradient(70% 36% at 50% -4%, rgba(43, 168, 74, .16), transparent 72%); }
button, .press { transition: transform var(--t-micro) var(--ease), background-color var(--t-micro) var(--ease), color var(--t-micro) var(--ease), box-shadow var(--t-micro) var(--ease); }
button:active, .press:active { transform: scale(.97); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition: none !important; } }

/* ---------- type ---------- */
h1.t { font-size: var(--fs-24); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: var(--lh-tight); margin: 0; }
h1.t.l { font-size: var(--fs-32); }
.meta { font-size: var(--fs-14); color: var(--ink-muted); margin: 0; }
.meta b { color: var(--ink); font-weight: var(--w-bold); }
.sec { font-size: var(--fs-14); font-weight: var(--w-bold); margin: var(--s-5) 0 var(--s-2); }
.sec span { font-weight: var(--w-regular); color: var(--ink-muted); margin-left: 8px; }
.big { font-size: var(--fs-44); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: 1; }
.big small, .n small { font-size: var(--fs-14); font-weight: var(--w-regular); color: var(--ink-muted); letter-spacing: 0; margin-left: 4px; }
.on { color: var(--accent); }
.warn-text { color: var(--warn); }
.coach-text { color: var(--coach); }

/* ---------- top of a sub screen ---------- */
.top { display: flex; align-items: center; gap: var(--s-3); min-height: var(--tap); margin-bottom: var(--s-3); }
.top .back { width: var(--tap); height: var(--tap); display: grid; place-items: center; border-radius: var(--r-pill); background: var(--surface); margin-left: -8px; }
.top .back:active { background: var(--surface-2); }
.top .title { flex: 1; min-width: 0; }
.top .title b { display: block; font-size: var(--fs-20); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: var(--lh-tight); }
.top .title span { font-size: var(--fs-14); color: var(--ink-muted); }
.top .pill { font-size: var(--fs-12); font-weight: var(--w-bold); padding: 6px 12px; border-radius: var(--r-pill); background: var(--surface); color: var(--ink-muted); white-space: nowrap; }
.top .pill.go { background: var(--accent); color: var(--on-accent); }

/* ---------- buttons ---------- */
.btn { display: flex; align-items: center; justify-content: center; gap: var(--s-2); height: 52px; border-radius: var(--r-pill); font-weight: var(--w-bold); font-size: var(--fs-16); width: 100%; background: var(--surface-2); color: var(--ink); position: relative; overflow: hidden; }
.btn.strong { background: var(--accent-strong); color: var(--on-accent-strong); box-shadow: var(--glow-soft); }
.btn.strong:active { box-shadow: var(--glow); }
.btn.quiet { background: var(--surface); color: var(--ink-muted); }
.btn.warm { background: var(--coach); color: var(--on-coach); } /* not .coach: that is the note card, whose padding and text size pushed this button's label off centre */
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn.auto { width: auto; padding: 0 20px; height: 44px; }
/* save button states: idle, saving (bar sweeps), saved (tick draws), failed (shake). One element morphs, nothing jumps. */
.btn .st { display: none; align-items: center; gap: 8px; }
.btn[data-state="idle"] .st-idle, .btn[data-state="saving"] .st-saving, .btn[data-state="saved"] .st-saved, .btn[data-state="failed"] .st-failed { display: inline-flex; }
.btn[data-state="saving"]::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 40%; background: var(--on-accent-strong); opacity: .5; animation: sweep 900ms var(--ease) infinite; }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
.btn[data-state="saved"] { background: var(--accent); color: var(--on-accent); }
.btn[data-state="failed"] { background: var(--coach); color: var(--on-coach); animation: shake var(--t-screen) var(--ease); }
@keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
.tickdraw { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw var(--t-draw) var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* ---------- surfaces, rows, lists ---------- */
.card { background: var(--surface); border-radius: var(--r-card); padding: var(--s-4); }
.list { background: var(--surface); border-radius: var(--r-card); overflow: hidden; }
.row { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); min-height: 52px; padding: var(--s-2) var(--s-4); width: 100%; text-align: left; }
.row + .row { border-top: 1px solid var(--line); }
.row .l { font-weight: var(--w-bold); flex: 1; min-width: 0; }
.row .l span { display: block; font-weight: var(--w-regular); color: var(--ink-muted); font-size: var(--fs-14); }
.row .v { font-weight: var(--w-bold); text-align: right; white-space: nowrap; font-size: var(--fs-20); letter-spacing: var(--track-tight); }
.row .v.on { color: var(--accent); }
.row .v small { font-weight: var(--w-regular); color: var(--ink-muted); font-size: var(--fs-14); margin-left: 4px; letter-spacing: 0; }
.row .v.empty { color: var(--ink-muted); font-weight: var(--w-regular); font-size: var(--fs-16); }
button.row:active { background: var(--surface-2); transform: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; }
.two .row:nth-child(odd) { border-right: 1px solid var(--line); }
.two .row:nth-child(-n+2) { border-top: 0; }
.two .row { display: block; min-height: 0; padding: var(--s-3) var(--s-4); }
.two .row b { display: block; font-size: var(--fs-12); color: var(--ink-muted); font-weight: var(--w-bold); }
.two .row .n { font-size: var(--fs-24); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: 1.2; }
.two .row .n.empty { color: var(--ink-muted); font-weight: var(--w-regular); font-size: var(--fs-16); }
.two .row.wide { grid-column: 1 / -1; border-right: 0; }
.tick { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-strong); color: var(--on-accent-strong); display: inline-grid; place-items: center; flex: none; transition: background-color var(--t-micro) var(--ease), box-shadow var(--t-micro) var(--ease); }
.tick svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.tick.off { background: transparent; box-shadow: inset 0 0 0 2px var(--line); }
.tick.off svg { opacity: 0; }
.tick:not(.off) svg { stroke-dasharray: 24; animation: draw var(--t-micro) var(--ease) forwards; }
.tick.pop { animation: pop var(--t-screen) var(--ease); }
.linkrow { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); min-height: var(--tap); font-weight: var(--w-bold); width: 100%; text-align: left; text-decoration: none; }
.linkrow + .linkrow { border-top: 1px solid var(--line); }
.linkrow span { color: var(--ink-muted); font-weight: var(--w-regular); font-size: var(--fs-14); text-align: right; }
.linkrow svg { color: var(--ink-muted); }

/* ---------- hero ring ---------- */
.hero { display: flex; align-items: center; gap: var(--s-4); margin-top: var(--s-4); }
.ring { width: 112px; height: 112px; flex: none; }
.ring circle { fill: none; stroke-width: 10; }
.ring .track { stroke: var(--surface-2); }
.ring .bar { stroke: url(#ringGrad); stroke-linecap: round; transition: stroke-dashoffset var(--t-draw) var(--ease); }
.ring.big { width: 140px; height: 140px; }
.ring.hero { width: 156px; height: 156px; filter: drop-shadow(var(--glow)); animation: glowpulse 3.2s var(--ease) infinite; }
.ring.hero .bar { transition-duration: var(--t-hero); stroke-width: 11; }
.ring.hero .track { stroke: var(--surface-2); }
.hero .n { font-size: var(--fs-44); }
.hero .n { font-size: var(--fs-32); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: 1; }
.hero .n .of { font-size: var(--fs-16); font-weight: var(--w-regular); color: var(--ink-muted); letter-spacing: 0; }
/* ---------- Today: the monogram is the one light. Embers rise from behind it; heat (daily targets hit today) feeds it ---------- */
.fire { position: relative; margin: 0 calc(-1 * var(--gutter)); padding: 0 var(--gutter); overflow: hidden; }
.fire > * { position: relative; z-index: 2; }
.pool { position: absolute; z-index: 0; left: 50%; top: 50%; width: calc(var(--s-7) * 9); height: calc(var(--s-7) * 9); margin: calc(var(--s-7) * -4.5) 0 0 calc(var(--s-7) * -4.5); border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(var(--ember), 0.38) 0%, rgba(var(--ember), 0.14) 32%, rgba(var(--ember), 0.05) 52%, transparent 68%);
  opacity: calc(0.45 + 0.55 * var(--heat)); will-change: transform; animation: drift1 calc(var(--t-hero) * 48) var(--ease) infinite alternate; }
.fire > .embers { position: absolute; z-index: 1; inset: 0; pointer-events: none; }
.fire > .pool { -webkit-mask-image: linear-gradient(to bottom, var(--charcoal) 50%, transparent 78%); mask-image: linear-gradient(to bottom, var(--charcoal) 50%, transparent 78%); } /* the pool fades before the zone clips it: no hard edge under the hero */
.logo-stage { width: calc(var(--s-7) * 3); height: calc(var(--s-7) * 3); margin: var(--s-3) auto 0; } /* air under the date; the png's own letterbox spaces it from the lines */
.logo-icon { position: absolute; inset: 0; opacity: 0;
  animation: logoIn calc(var(--t-screen) * 2) var(--ease) 0s forwards, logoIgnite calc(var(--t-hero) * 2) var(--ease) calc(var(--t-screen) * 2) 1, logoGlow calc(var(--t-hero) * 6) var(--ease) calc(var(--t-screen) * 2 + var(--t-hero) * 2) infinite; /* in as fast as a card, then the ignite and the slow glow */
  will-change: opacity, filter; }
.logo-icon img { width: 100%; height: 100%; display: block; object-fit: contain; }
.logo-heat { position: absolute; inset: 0; -webkit-mask: center / contain no-repeat; mask: center / contain no-repeat;
  background: linear-gradient(115deg, transparent 20%, rgba(var(--ember), 0.77) 40%, rgba(var(--amber), 0.49) 50%, rgba(var(--ember), 0.77) 60%, transparent 80%);
  background-size: 300% 100%; opacity: 0; animation: heatSweep calc(var(--t-hero) * 6) var(--ease) calc(var(--t-screen) * 2) infinite; will-change: background-position, opacity; }
@keyframes logoIn {
  from { opacity: 0; filter: drop-shadow(0 0 0 rgba(var(--ember), 0)); }
  to   { opacity: 1; filter: drop-shadow(0 0 calc(var(--s-1) * 4.5) rgba(var(--ember), 0.5)); }
}
@keyframes logoGlow {
  0%, 100% { filter: drop-shadow(0 0 calc(var(--s-1) * 2.5) rgba(var(--ember), 0.25)); }
  50%      { filter: drop-shadow(0 0 calc(var(--s-1) * 5.5) rgba(var(--ember), calc(0.3 + 0.4 * var(--heat)))) drop-shadow(0 0 calc(var(--s-1) * 10) rgba(var(--amber), 0.12)); }
}
@keyframes logoIgnite {
  0%   { filter: drop-shadow(0 0 var(--s-4) rgba(var(--ember), 0.45)); }
  35%  { filter: drop-shadow(0 0 var(--s-6) rgba(var(--ember), 0.75)) drop-shadow(0 0 calc(var(--s-1) * 15.5) rgba(var(--amber), 0.3)); }
  70%  { filter: drop-shadow(0 0 var(--s-5) rgba(var(--ember), 0.55)) drop-shadow(0 0 calc(var(--s-1) * 11) rgba(var(--amber), 0.17)); }
  100% { filter: drop-shadow(0 0 calc(var(--s-1) * 2.5) rgba(var(--ember), 0.25)); }
}
@keyframes heatSweep {
  0%   { background-position: 120% 0; opacity: 0; }
  15%  { opacity: 1; }
  45%  { opacity: 0.7; }
  70%  { background-position: -60% 0; opacity: 0; }
  100% { background-position: -60% 0; opacity: 0; }
}
@keyframes drift1 {
  0%   { transform: translate3d(0, 0, 0) scale(1); }
  50%  { transform: translate3d(8vw, 6vh, 0) scale(1.12); }
  100% { transform: translate3d(-4vw, 10vh, 0) scale(0.95); }
}
.lines { text-align: center; margin: 0; }
.lines p { margin: 0; font-size: var(--fs-20); line-height: var(--lh-tight); letter-spacing: var(--track-tight); text-wrap: balance; animation: rise var(--t-screen) var(--ease) both; animation-delay: calc(var(--t-screen) + var(--i) * var(--t-micro) / 2); } /* same clock as every other tab: 80 ms steps from the screen */
.lines p + p { margin-top: var(--s-2); }
.lines .well { font-weight: var(--w-bold); }
.lines .focus b { color: var(--accent); font-weight: var(--w-bold); }

/* Target rows as cards, the Workout session-card look Adam liked: a card each, a hit one outlined in emerald with the pool glow from the left */
.tlist { display: grid; gap: var(--s-2); background: none; border-radius: 0; overflow: visible; animation: appear var(--t-screen) var(--ease) both; animation-delay: var(--t-screen); }

.trow > * { position: relative; z-index: 1; }
.trow a.tl { color: inherit; text-decoration: none; min-height: var(--tap); display: grid; align-content: center; }
.trow .cit { width: var(--tap); height: var(--tap); display: grid; place-items: center; flex: none; }
.pcard .dl { margin: 0; padding: var(--s-3) var(--s-4) var(--s-4); color: var(--ink-muted); line-height: var(--lh-body); }
/* The same card look on Habits, tasks and Plan: a card each with a faint outline; emerald outline and left glow once ticked (Plan cards always, nothing there completes) */
.habits, .list.tasks { display: grid; gap: var(--s-2); background: none; box-shadow: none; border-radius: 0; padding: 0; overflow: visible; }
.habits .hab, .list.tasks .hab { position: relative; overflow: hidden; border-radius: var(--r-card); background: var(--surface); box-shadow: 0 0 0 1px var(--line); padding: var(--s-2) var(--s-4); border-top: 0; }
.entry, .planrow, .pcard { position: relative; overflow: hidden; }
.habits .hab > *, .list.tasks .hab > *, .entry > *, .planrow > *, .pcard > * { position: relative; z-index: 1; }
.habits .hab:has(.tick:not(.off)), .list.tasks .hab:has(.tick:not(.off)), .entry, .planrow, .pcard { box-shadow: 0 0 0 1px var(--accent); }
.habits .hab:has(.tick:not(.off))::before, .list.tasks .hab:has(.tick:not(.off))::before, .entry::before, .planrow::before, .pcard::before { content: ""; position: absolute; z-index: 0; inset: 0; pointer-events: none; background: radial-gradient(circle calc(var(--s-7) * 2.5) at 18% 50%, rgba(var(--ember), .30) 0%, rgba(var(--ember), .11) 32%, rgba(var(--ember), .04) 52%, transparent 68%); } /* the Workout session card's pool, same size and stops, so every card glows the same */
@keyframes appear { from { opacity: 0; } }
.trow { position: relative; overflow: hidden; display: flex; align-items: center; gap: var(--s-3); width: 100%; min-height: var(--tap); padding: var(--s-3) var(--s-4); border-radius: var(--r-card); background: var(--surface); text-align: left; animation: rise var(--t-screen) var(--ease) both; animation-delay: calc(var(--t-screen) + (var(--i) + 3) * var(--t-micro) / 2); } /* after the three lines */
.trow:active { background: var(--surface-2); transform: none; }
.trow .tl { flex: 1; min-width: 0; }
.trow .tl span { display: block; font-size: var(--fs-14); color: var(--ink-muted); line-height: var(--lh-tight); }
.trow .tl b { display: block; font-size: var(--fs-20); font-weight: var(--w-bold); letter-spacing: var(--track-tight); line-height: var(--lh-tight); margin-top: var(--s-1); }
.trow .tick { width: calc(var(--s-5) + var(--s-1)); height: calc(var(--s-5) + var(--s-1)); }
.trow .tick svg { width: var(--s-4); height: var(--s-4); }
.trow > svg.i { color: var(--ink-muted); }
/* a re-render of Today (a tap, a save landing, the data or plan arriving) carries every animation on from where it was: mid-cascade it keeps rising, after it a still */
.screen.again { animation-delay: var(--since); }
.again .lines p { animation-delay: calc(var(--t-screen) + var(--i) * var(--t-micro) / 2 + var(--since)); }
.again .tlist { animation-delay: calc(var(--t-screen) + var(--since)); }
.again .trow { animation-delay: calc(var(--t-screen) + (var(--i) + 3) * var(--t-micro) / 2 + var(--since)); }
.again .pool { animation-delay: var(--since); }
.again .logo-icon { animation-delay: var(--since), calc(var(--t-screen) * 2 + var(--since)), calc(var(--t-screen) * 2 + var(--t-hero) * 2 + var(--since)); }
.again .logo-heat { animation-delay: calc(var(--t-screen) * 2 + var(--since)); }

.ci .tlist { animation-delay: 0s; } /* Check in has no hero: the cards come in one after the other from the start, the deadline last */
.ci .trow { animation-delay: calc(var(--i, 0) * var(--t-micro)); }
.ci .pcard { animation: rise var(--t-screen) var(--ease) both; animation-delay: calc(var(--i, 3) * var(--t-micro)); }
/* staged entrance (Progress, Plan): stage() numbers the blocks and each rises in turn; the chart line draws once its block is up,
   then the points, labels and area arrive. A re-render of the same screen (.again) shows everything still, no replay. */
.seq-i { animation: rise var(--t-screen) var(--ease) both; animation-delay: calc(var(--i, 0) * var(--t-micro) / 2); }
.seq-i .chart .line { animation-duration: var(--t-hero); animation-delay: calc(var(--i, 0) * var(--t-micro) / 2 + var(--t-screen)); }
.seq-i .chart .area { animation-delay: calc(var(--i, 0) * var(--t-micro) / 2 + var(--t-screen) + var(--t-hero)); }
.seq-i .chart .dot, .seq-i .chart .trend, .seq-i .chart text { opacity: 0; animation: fadein var(--t-screen) var(--ease) both; animation-delay: calc(var(--i, 0) * var(--t-micro) / 2 + var(--t-screen) + var(--t-hero)); }
.seq-i .chart .halo { opacity: 0; animation: fadein var(--t-screen) var(--ease) both, halo 1.8s var(--ease) infinite; animation-delay: calc(var(--i, 0) * var(--t-micro) / 2 + var(--t-screen) + var(--t-hero)); }
.again .seq-i { animation-delay: calc(var(--i, 0) * var(--t-micro) / 2 + var(--since)); } /* a re-render carries each block on from where it was (Today mid-cascade); Progress and Plan set --since far back, so theirs are stills */
.again .seq-i .chart .line, .again .seq-i .chart .area, .again .seq-i .chart .dot, .again .seq-i .chart .trend, .again .seq-i .chart text { animation: none; opacity: 1; stroke-dashoffset: 0; }
.again .seq-i .chart .halo { opacity: 1; animation: halo 1.8s var(--ease) infinite; }
.again .seq-i .chart .area.c { opacity: .18; }
/* Progress chart modes: a segmented switch, one coloured line per series, the legend as chips that hide or show a line */
.seg { display: flex; gap: 4px; padding: 4px; margin-top: var(--s-4); border-radius: var(--r-pill); background: var(--surface-2); }
.seg button { flex: 1 1 auto; min-height: 36px; padding: 0 10px; white-space: nowrap; border-radius: var(--r-pill); font-size: var(--fs-14); font-weight: var(--w-bold); color: var(--ink-muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: var(--s-2); margin-top: var(--s-3); }
.lchip { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px; border-radius: var(--r-pill); background: var(--surface); box-shadow: 0 0 0 1px var(--line); font-size: var(--fs-14); font-weight: var(--w-bold); color: var(--ink); }
.lchip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); flex: none; }

.lchip[aria-pressed="false"] i { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
.lchip[aria-pressed="false"] b { color: var(--ink-muted); }
.lchip.all { color: var(--accent); }
.lchip small { font-weight: var(--w-regular); color: var(--ink-muted); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lchip:disabled { opacity: .55; }
.chart .line.c { stroke: var(--c); filter: drop-shadow(0 0 6px var(--c)); }
.chart .dot.c { fill: var(--c); }
.chart .halo.c { stroke: var(--c); }
.chart .area.c { fill: var(--c); animation-name: fadein-soft; }
@keyframes fadein-soft { to { opacity: .18; } }
.chart .zero { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
.pchart .cap { margin: var(--s-2) 0 0; font-size: var(--fs-14); color: var(--ink-muted); } /* the global 0ms delay would restart every 0.01ms animation from its first frame: a one-frame blink per tap */

/* ---------- week strip ---------- */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: var(--s-3); }
.strip button { display: grid; justify-items: center; gap: 6px; font-size: var(--fs-12); font-weight: var(--w-bold); color: var(--ink-muted); padding: 4px 0; border-radius: var(--r-chip); }
.strip button span { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 2px var(--line); color: var(--ink); font-size: var(--fs-12); transition: box-shadow var(--t-micro) var(--ease), background-color var(--t-micro) var(--ease); }
.strip button span.done { background: var(--accent-strong); color: var(--on-accent-strong); box-shadow: none; }

/* ---------- fields ---------- */
.form { display: grid; gap: var(--s-4); margin-top: var(--s-4); }

.scale button { height: var(--tap); border-radius: var(--r-chip); display: grid; place-items: center; background: var(--surface); box-shadow: var(--elev-1); font-weight: var(--w-bold); font-size: var(--fs-16); }
.scale.ten button { font-size: var(--fs-14); }

.hab { display: flex; align-items: center; gap: var(--s-3); min-height: var(--tap); width: 100%; text-align: left; padding: 0 var(--s-4); }

.note.warn { color: var(--warn); }

/* ---------- log sections: one card per group, its own colour on the rule and icon ---------- */
.fs { --sec: var(--accent-strong); background: var(--surface); border-radius: var(--r-card); box-shadow: var(--elev-1); padding: var(--s-4); position: relative; overflow: hidden; }
.fs::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--sec); }
.fs .fsh { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-4); }
.fs .fsh i { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--sec) 18%, transparent); color: var(--sec); }

.fs .field input, .fs .field textarea { background: var(--canvas); box-shadow: none; }
.fs .field input:focus, .fs .field textarea:focus { box-shadow: 0 0 0 2px var(--sec); }
.fs .scale button { background: var(--canvas); box-shadow: none; }
.fs .scale button.sel { background: var(--sec); color: var(--on-sec, var(--on-accent-strong)); }

.fs .form { margin-top: 0; }
.fs + .fs { margin-top: var(--s-4); }
.habits { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--elev-1); padding: var(--s-2) 0; }
.habits .hab { padding: 0 var(--s-4); }
.habits .hab span { font-weight: var(--w-bold); }
.habits .hab .tick:not(.off) + span { color: var(--ink-muted); font-weight: var(--w-regular); text-decoration: line-through; text-decoration-color: var(--line); }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); margin: var(--s-5) 0 var(--s-2); }
.sechead b { font-size: var(--fs-20); font-weight: var(--w-black); letter-spacing: var(--track-tight); }
.sechead span { font-size: var(--fs-14); color: var(--ink-muted); }
.sechead span.on { color: var(--accent); font-weight: var(--w-bold); }

/* ---------- sync line ---------- */
.sync { display: flex; align-items: center; gap: 8px; font-size: var(--fs-12); color: var(--ink-muted); margin-top: var(--s-3); min-height: 20px; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-strong); flex: none; }
.sync.pending { color: var(--warn); } .sync.pending::before { background: var(--warn); }
.sync.error { color: var(--warn); } .sync.error::before { background: var(--warn); }

/* ---------- chart ---------- */
.chart { width: 100%; height: auto; display: block; margin-top: var(--s-3); }
.chart .axis { stroke: var(--line); stroke-width: 1; }
.chart .goal { stroke: var(--coach); stroke-width: 1; stroke-dasharray: 3 4; }
.chart .line { stroke: var(--accent-strong); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--t-draw) var(--ease) forwards; }
.chart .trend { stroke: var(--ink-muted); stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
.chart .dot { fill: var(--accent-strong); }
.chart .area { fill: url(#areaGrad); opacity: 0; animation: fadein var(--t-draw) var(--ease) var(--t-draw) forwards; }
@keyframes fadein { to { opacity: 1; } }
.chart .line { filter: drop-shadow(0 0 7px rgba(43, 168, 74, .55)); }
.chart .halo { fill: none; stroke: var(--accent-strong); stroke-width: 2; animation: halo 1.8s var(--ease) infinite; }
.chart text { font-family: var(--font); font-size: 11px; fill: var(--ink-muted); font-weight: var(--w-bold); }

/* ---------- workout: sessions, set table, overview, done ---------- */
.session { margin-top: var(--s-4); background: var(--surface); border-radius: var(--r-card); padding: var(--s-4); display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
.session .meta { margin-top: 2px; }
.days { list-style: none; margin: var(--s-3) 0 0; padding: 0; display: grid; gap: var(--s-2); }
.day { width: 100%; text-align: left; display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4); border-radius: var(--r-card); background: var(--surface); position: relative; overflow: hidden; animation: rise var(--t-screen) var(--ease) both; animation-delay: calc(var(--i, 0) * var(--t-micro) / 2); }
.day > * { position: relative; z-index: 1; }
.day b { font-size: var(--fs-20); display: block; letter-spacing: var(--track-tight); color: var(--ink); }
.day span { font-size: var(--fs-14); color: var(--ink-muted); }
.day .grow { flex: 1; min-width: 0; }
.day.is-done b { color: var(--ink-muted); }

.day > .pool { position: absolute; z-index: 0; --heat: .6; width: calc(var(--s-7) * 5); height: calc(var(--s-7) * 5); left: 18%; margin: calc(var(--s-7) * -2.5) 0 0 calc(var(--s-7) * -2.5); animation: none; }
.day .mini { flex: none; width: 44px; height: 44px; display: grid; place-items: center; }
.day .mini .ring { position: absolute; inset: 0; width: 44px; height: 44px; }
.day .mini .ring circle { stroke-width: 12; }
.day .mini .tick { position: relative; }
.day .go { flex: none; height: 40px; padding: 0 var(--s-4); border-radius: var(--r-pill); display: grid; place-items: center; background: var(--surface-2); color: var(--ink-muted); font-size: var(--fs-14); font-weight: var(--w-bold); }
.day .go.start { background: var(--accent-strong); color: var(--on-accent-strong); box-shadow: var(--glow-soft); }
.ex h1 { font-size: var(--fs-32); line-height: var(--lh-tight); margin: 0; letter-spacing: var(--track-tight); font-weight: var(--w-black); text-wrap: balance; }
.target { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: var(--s-3) 0 0; padding: 0; list-style: none; }
.target li { font-size: var(--fs-14); color: var(--ink-muted); }
.target b { color: var(--ink); font-size: var(--fs-20); margin-right: 4px; }
.video { margin-top: var(--s-3); display: inline-flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--r-pill); background: var(--surface); text-decoration: none; font-weight: var(--w-bold); font-size: var(--fs-14); }
.video svg { color: var(--accent); }
/* the ledger: one row per set (number | kg | reps | tick), last week's set as the ghost in the boxes, the target under them */
.ex.still { animation: none; } /* a re-render after a tap: no slide in again */
.ledger { margin-top: var(--s-4); background: var(--surface); border-radius: var(--r-card); overflow: hidden; }
.ledger .hd { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-3); padding: var(--s-3) var(--s-4) var(--s-2); font-size: var(--fs-12); font-weight: var(--w-bold); color: var(--ink-muted); }

  scroll-margin: var(--s-4) 0 calc(180px + env(safe-area-inset-bottom)); transition: padding var(--t-micro) var(--ease), box-shadow var(--t-micro) var(--ease); }

.lrow input { width: 100%; height: var(--tap); padding: 0 32px 0 10px; text-align: right; font-size: var(--fs-20); font-weight: var(--w-bold); border-radius: var(--r-chip); border: 0; background: var(--canvas); color: var(--ink); caret-color: var(--accent);
  transition: height var(--t-micro) var(--ease), font-size var(--t-micro) var(--ease), background-color var(--t-micro) var(--ease), box-shadow var(--t-micro) var(--ease); }

.lrow .box.reps input { padding-right: 44px; }

.lrow .tgt { grid-area: tgt; display: flex; align-items: center; gap: var(--s-2); min-width: 0; font-size: var(--fs-12); color: var(--ink-muted); line-height: var(--lh-body); }
.lrow .tgt b { color: var(--ink); font-weight: var(--w-bold); }

.lrow .ok svg { width: 18px; height: 18px; stroke-width: 3; opacity: 0; }
.lrow .log { grid-area: log; display: none; }
.lrow .use { margin-left: auto; flex: none; height: 32px; padding: 0 var(--s-3); border-radius: var(--r-pill); background: var(--surface-2); color: var(--ink); font-size: var(--fs-12); font-weight: var(--w-bold); }
.lrow .use, .top .pill { position: relative; } .lrow .use::after, .top .pill::after { content: ""; position: absolute; inset: calc(var(--s-2) * -1) 0; } /* invisible hit area: 32 px to 48 px and 29 px to 45 px tall, look unchanged */
.lrow .box.wide input { padding-right: 52px; }
@media (max-width: 389px) { .lrow:not(.cur) .box input, .lrow.plus:not(.cur) .box input { padding: 0 var(--s-1) var(--s-3); text-align: center; } .lrow:not(.cur) .unit { top: auto; bottom: var(--s-1); left: 0; right: 0; transform: none; text-align: center; } }
.ledger .hd .unitsw { height: 32px; margin: -8px 0; padding: 0 var(--s-3); border-radius: var(--r-pill); background: var(--surface-2); color: var(--ink); font-size: var(--fs-12); font-weight: var(--w-bold); }
.ex .setup { display: block; width: 100%; text-align: left; margin-top: var(--s-3); font-size: var(--fs-14); line-height: var(--lh-body); color: var(--ink-muted); }

.lrow .edit { margin-left: auto; flex: none; height: 32px; padding: 0 var(--s-3); border-radius: var(--r-pill); background: var(--surface-2); color: var(--ink-muted); font-size: var(--fs-12); font-weight: var(--w-bold); }

/* the current set is the stage: same row, big numbers, the unit under them, one Log button that says what it will log */
.lrow.cur { grid-template-columns: 20px 3fr 2fr; /* kg gets the wider box: a 5-character load (122.5) fits at --fs-44 */ grid-template-areas: "no kg reps" "tgt tgt tgt" "log log log"; row-gap: var(--s-3); padding: var(--s-4); }

.lrow.cur .log svg { stroke-width: 3; }
.alldone { display: flex; align-items: center; gap: var(--s-3); margin: var(--s-3) 0 0; font-size: var(--fs-14); font-weight: var(--w-bold); }
/* rest: a bar pinned above the action bar, the time big, -15 / +15 / Skip, a track draining */
#app.resting { padding-bottom: calc(270px + env(safe-area-inset-bottom)); }
.restbar { position: fixed; left: 0; right: 0; margin: 0 auto; width: 100%; max-width: 520px; bottom: calc(160px + env(safe-area-inset-bottom)); z-index: 6; padding: 0 var(--gutter); animation: sheet-in var(--t-screen) var(--ease) both; }
.restbar .in { position: relative; overflow: hidden; background: var(--surface); border-radius: var(--r-card); box-shadow: var(--elev-1); padding: var(--s-3) var(--s-3) var(--s-3) var(--s-4); display: flex; align-items: center; gap: var(--s-2); }
.restbar .t { flex: 1; min-width: 0; font-size: var(--fs-32); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: 1; color: var(--accent); }
.restbar .t small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: var(--fs-12); font-weight: var(--w-regular); color: var(--ink-muted); letter-spacing: 0; line-height: var(--lh-tight); margin-top: var(--s-1); }

.comment { margin-top: var(--s-3); }
.comment input { width: 100%; height: 48px; padding: 0 var(--s-4); border-radius: var(--r-card); border: 0; background: var(--surface); color: var(--ink); }
.comment input::placeholder { color: var(--ink-muted); }
.hint { color: var(--warn); font-size: var(--fs-14); margin: var(--s-3) 0 0; }
.confirm { position: fixed; inset: 0; z-index: 9; display: grid; align-items: end; background: rgba(26, 28, 26, .7); animation: fadein var(--t-screen) var(--ease) both; }
.confirm .box { margin: 0 auto; width: 100%; max-width: 520px; padding: var(--s-5) var(--gutter) calc(var(--s-5) + env(safe-area-inset-bottom)); border-radius: var(--r-sheet) var(--r-sheet) 0 0; background: var(--surface); box-shadow: var(--elev-2); display: grid; gap: var(--s-3); animation: sheet-in var(--t-screen) var(--ease) both; }
.confirm .box b { font-size: var(--fs-20); font-weight: var(--w-black); letter-spacing: var(--track-tight); }
.confirm .box p { margin: 0; color: var(--ink-muted); }
.confirm .btn.quiet { background: var(--surface-2); color: var(--ink); }
.actbar { position: fixed; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 6; padding: var(--s-3) 0; background: linear-gradient(to top, var(--canvas) 70%, transparent); }
.actbar .wrap { display: flex; gap: var(--s-2); }

.ov ol { list-style: none; margin: var(--s-3) 0 0; padding: 0; display: grid; gap: var(--s-2); }
.ov .item { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-3) var(--s-3) var(--s-4); border-radius: var(--r-card); background: var(--surface); }
.ov .item .info { flex: 1; min-width: 0; }
.ov .item b { display: block; }
.ov .item span { font-size: var(--fs-14); color: var(--ink-muted); }
.ov .item.is-done { opacity: .8; }
.ov .item.is-skipped b { text-decoration: line-through; color: var(--ink-muted); }
.ov .item.is-current { box-shadow: 0 0 0 2px var(--accent); }
.chip { height: 36px; padding: 0 12px; border-radius: var(--r-pill); font-size: var(--fs-14); font-weight: var(--w-bold); background: var(--surface-2); }

.fin .moved::before { content: ""; position: absolute; inset: -40% -10%; pointer-events: none; background: radial-gradient(ellipse at 50% 40%, rgba(var(--ember), .22) 0%, rgba(var(--ember), .08) 40%, transparent 68%); }

/* ---------- plan: a hub of three entries, then one screen per thing ---------- */
.entries { display: grid; gap: var(--s-3); margin-top: var(--s-4); }
.entry { color: inherit; text-decoration: none; display: flex; align-items: center; gap: var(--s-4); width: 100%; text-align: left; padding: var(--s-4); min-height: 88px; border-radius: var(--r-card); background: var(--surface); box-shadow: var(--elev-1); }
.entry .ic { flex: none; width: 52px; height: 52px; border-radius: var(--r-card); display: grid; place-items: center; background: var(--surface-2); color: var(--accent); }
.entry .ic svg { width: 26px; height: 26px; }
.entry .tx { flex: 1; min-width: 0; }
.entry .tx b { display: block; font-size: var(--fs-20); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: var(--lh-tight); }
.entry .tx span { display: block; font-size: var(--fs-14); color: var(--ink-muted); margin-top: 4px; }
.entry > svg.i { color: var(--ink-muted); }
.entry:active { background: var(--surface-2); }
.pcard { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--elev-1); margin-top: var(--s-4); overflow: hidden; }
.pcard .hd { padding: var(--s-4); display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s-3); border-bottom: 1px solid var(--line); }
.pcard .hd b { font-size: var(--fs-20); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: var(--lh-tight); }
.pcard .hd .tag { display: block; font-size: var(--fs-12); font-weight: var(--w-bold); color: var(--accent); margin-bottom: 4px; }
.pcard .hd .kcal { flex: none; max-width: 60%; overflow-wrap: normal; text-align: right; font-size: var(--fs-20); font-weight: var(--w-black); color: var(--accent); letter-spacing: var(--track-tight); }
.pcard .hd .kcal small { display: block; font-size: var(--fs-12); font-weight: var(--w-regular); color: var(--ink-muted); letter-spacing: 0; }
.pcard .food { display: flex; justify-content: space-between; gap: var(--s-3); padding: var(--s-3) var(--s-4); }
.pcard .food + .food { border-top: 1px solid var(--line); }
.pcard .food b { font-weight: var(--w-bold); }
.pcard .food span { color: var(--ink); font-weight: var(--w-bold); max-width: 60%; overflow-wrap: normal; text-align: right; }
.pcard .tot { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface-2); padding: var(--s-3) var(--s-4); }
.pcard .tot div { font-size: var(--fs-12); color: var(--ink-muted); }
.pcard .tot div b { display: block; font-size: var(--fs-16); color: var(--ink); font-weight: var(--w-black); }
.kv { display: grid; grid-template-columns: 72px 1fr; gap: var(--s-2) var(--s-3); padding: var(--s-3) var(--s-4); }
.kv span { font-size: var(--fs-12); font-weight: var(--w-bold); color: var(--ink-muted); padding-top: 3px; }
.kv div { font-size: var(--fs-16); }
.kv div.big { font-size: var(--fs-20); font-weight: var(--w-black); color: var(--accent); letter-spacing: var(--track-tight); }
.kv div.txt { color: var(--ink-muted); font-size: var(--fs-14); white-space: pre-line; }
.planrow { display: flex; align-items: center; gap: var(--s-3); width: 100%; text-align: left; padding: var(--s-4); border-radius: var(--r-card); background: var(--surface); box-shadow: var(--elev-1); }
.planrow .n { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); color: var(--accent); display: grid; place-items: center; font-weight: var(--w-black); }
.planrow .tx { flex: 1; min-width: 0; }
.planrow .tx b { display: block; font-size: var(--fs-20); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: var(--lh-tight); }
.planrow .tx span { font-size: var(--fs-14); color: var(--ink-muted); }
.planrow > svg.i { color: var(--ink-muted); }
.planrow:active { background: var(--surface-2); }
.targets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: var(--s-3); }
.targets div { background: var(--surface); border-radius: var(--r-card); padding: var(--s-3) var(--s-2); text-align: center; }
.targets div b { display: block; font-size: var(--fs-20); font-weight: var(--w-black); letter-spacing: var(--track-tight); color: var(--accent); }
.targets div span { font-size: var(--fs-12); color: var(--ink-muted); }
.shop { list-style: none; margin: var(--s-3) 0 0; padding: 0; display: grid; gap: var(--s-2); }
.shop li button { position: relative; overflow: hidden; width: 100%; display: flex; gap: var(--s-3); align-items: center; padding: var(--s-3) var(--s-4); border-radius: var(--r-card); background: var(--surface); box-shadow: 0 0 0 1px var(--line); text-align: left; }
.shop li button > * { position: relative; z-index: 1; }
.shop li button b { flex: 1; min-width: 0; }
.shop li.got button { box-shadow: 0 0 0 1px var(--accent); }
.shop li.got button::before { content: ""; position: absolute; z-index: 0; inset: 0; pointer-events: none; background: radial-gradient(circle calc(var(--s-7) * 2.5) at 18% 50%, rgba(var(--ember), .30) 0%, rgba(var(--ember), .11) 32%, rgba(var(--ember), .04) 52%, transparent 68%); }
.shop li.got b { color: var(--ink-muted); font-weight: var(--w-regular); text-decoration: line-through; text-decoration-color: var(--line); }
.shop li span { color: var(--ink-muted); max-width: 60%; overflow-wrap: normal; text-align: right; }
.stepper { display: flex; align-items: center; gap: var(--s-2); }
.stepper button { width: 40px; height: 40px; border-radius: var(--r-pill); background: var(--surface-2); font-size: var(--fs-20); display: grid; place-items: center; }
.stepper b { width: 28px; text-align: center; }

/* ---------- photos ---------- */
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: var(--s-3); }
.thumbs figure { margin: 0; position: relative; border-radius: var(--r-card); overflow: hidden; aspect-ratio: 3 / 4; background: var(--surface); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.thumbs figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 6px; font-size: var(--fs-12); background: rgba(34, 34, 34, .8); color: var(--ink); }
.pick { display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: var(--r-pill); background: var(--accent-strong); color: var(--on-accent-strong); font-weight: var(--w-bold); cursor: pointer; margin-top: var(--s-3); }
.pick input { display: none; }

/* ---------- dock ---------- */
.dock { position: fixed; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; bottom: 0; z-index: 7; border-radius: var(--r-sheet) var(--r-sheet) 0 0; height: calc(84px + env(safe-area-inset-bottom)); padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom)); display: flex; justify-content: space-around; align-items: flex-start; background: var(--surface); box-shadow: var(--elev-2); }
.dock button { color: var(--ink-muted); font-size: var(--fs-12); font-weight: var(--w-bold); white-space: nowrap; display: grid; justify-items: center; gap: 4px; min-width: var(--tap); padding: 6px 8px; border-radius: var(--r-card); position: relative; }
.dock button.on { color: var(--accent); }
.dock button.on::before { content: ""; position: absolute; inset: 0; border-radius: var(--r-card); background: rgba(43, 168, 74, .12); box-shadow: var(--glow-soft); animation: pop var(--t-screen) var(--ease); }
.dock button svg { position: relative; }
.dock button:active { transform: none; background: var(--surface-2); }

/* success moment: one full-screen beat after a save, a session, a milestone. Tap or wait to dismiss. */
.moment { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; padding: var(--gutter); background: rgba(26, 28, 26, .94); animation: fadein var(--t-screen) var(--ease) both; cursor: pointer; }
.moment.out { animation: fadeout var(--t-screen) var(--ease) forwards; }
@keyframes fadeout { to { opacity: 0; } }
.moment .in { display: grid; justify-items: center; text-align: center; gap: var(--s-3); animation: pop var(--t-draw) var(--ease) both; }
.moment .huge { font-size: var(--fs-64); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: 1; color: var(--accent); }
.moment .huge small { display: block; font-size: var(--fs-16); font-weight: var(--w-regular); color: var(--ink-muted); letter-spacing: 0; margin-top: var(--s-2); }
.moment .line { color: var(--ink); font-weight: var(--w-bold); font-size: var(--fs-20); }

/* Today: one compact row after the tasks */

/* the Trial features screen */

.lab-tour-list .row { padding-top: var(--s-3); padding-bottom: var(--s-3); }
.lab-tour-list .btn { flex: none; }

/* what's new: the page's bottom sheet. Only the list scrolls, so the title and Got it stay in view however long it is. */

<script>
// Served two ways: by Apps Script (template tags filled in) or as a plain page on GitHub Pages, where the link
// carries the script (?s=<deployment id>) and key (?k=). Plain page without ?s = mock backend for testing.
var Q = new URLSearchParams(location.search);
var KEY = '<?= key ?>'; if (KEY.charAt(0) === '<') KEY = Q.get('k') || '';
var CLIENT = /^c_[a-z0-9]{10}$/.test(Q.get('c') || '') ? Q.get('c') : ''; // hub link: ?s=<hub deployment>&c=<client id>&k=<key>
var SCRIPT = /^[\w-]{20,}$/.test(Q.get('s') || '') ? Q.get('s') : '';
var SAVED_TO = document.body.dataset.savedTo.charAt(0) === '<' ? 'Adam\'s sheet' : document.body.dataset.savedTo;
var LS = (function () {
  try { localStorage.setItem('cw:t', '1'); localStorage.removeItem('cw:t'); return localStorage; }
  catch (e) { var m = {}; return { getItem: function (k) { return k in m ? m[k] : null; }, setItem: function (k, v) { m[k] = String(v); }, removeItem: function (k) { delete m[k]; } }; }
})();

/* ---------- trial features (LAB): each feature is a module in lab-build/modules, pasted between the marks below by
   test/lab-assemble.js. Every client loads this page but only the owner has the switch (lab()), so a module body runs only
   when lab() is true, lazily, inside try/catch, and every slot, filter, action, screen and event call is guarded: a broken trial
   gives '' and a console.warn, never an error in the page. Without the switch every call here returns at once. ---------- */

  function add(map, name, item) { (map[name] = map[name] || []).push(item); }

  }

        try { var v = f(value, ctx || {}); if (v != null && typeof v === typeof value) value = v; else if (v !== undefined) warn('filter ' + name, 'wrong type'); } catch (e) { warn('filter ' + name, e); }

// Clean names once: the data splits a few words with ~ so the public build's name check never matches them (see the top).
function clean(s) { return String(s).replace(/~/g, ''); }
var CHAIN = CHAINS.map(clean);
var ITEMS = ROWS.map(function (r, i) {
  var o = { i: i, chain: CHAIN[r[0]], name: clean(r[1]), k: r[2], p: r[3], c: r[4], f: r[5], approx: !!r[6] };
  o.low = o.name.toLowerCase(); // a chosen chain searches names only, so "burger" at Burger King still narrows the list
  o.find = o.low + ' ' + o.chain.toLowerCase(); // every chain: name and chain, so "nando" finds Nando's
  return o;
});
var OVER = 0.1; // "Just over" reaches 10 percent past the kcal budget
var ui = { q: '', open: -1 }; // the search text and the expanded row live only while the screen is open

// fit: the ranked list for one chain ('' = every chain) and an optional search. Pure, so tests can call it.
// Fits first, best protein first (then fewer kcal); then "just over", least over first. Protein ranks and annotates, never filters.
function fit(chain, kcal, protein, q) {
  kcal = +kcal; protein = +protein || 0;
  if (!(kcal > 0)) return [];
  if (chain && CHAIN.indexOf(chain) < 0) return [];
  var words = String(q || '').toLowerCase().split(/\s+/).filter(Boolean);
  if (chain) { // a word from the chosen chain's own name that no item name holds ("nando" at Nando's) would empty the list: skip it
    var cl = chain.toLowerCase();
    words = words.filter(function (w) { return cl.indexOf(w) < 0 || ITEMS.some(function (x) { return x.chain === chain && x.low.indexOf(w) > -1; }); });
  }
  var fits = [], over = [];
  ITEMS.forEach(function (x) {
    if (chain && x.chain !== chain) return;
    var hay = chain ? x.low : x.find;
    for (var w = 0; w < words.length; w++) if (hay.indexOf(words[w]) < 0) return;
    var o = { i: x.i, chain: x.chain, name: x.name, kcal: x.k, protein: x.p, carbs: x.c, fat: x.f, approx: x.approx,
      over: 0, kcalLeft: Math.round(kcal - x.k), proteinLeft: Math.max(0, Math.round(protein - x.p)) };
    if (x.k <= kcal) fits.push(o);
    else if (x.k <= kcal * (1 + OVER)) { o.over = Math.round(x.k - kcal); o.kcalLeft = 0; over.push(o); }
  });
  fits.sort(function (a, b) { return b.protein - a.protein || a.kcal - b.kcal || (a.name < b.name ? -1 : 1); });
  over.sort(function (a, b) { return a.over - b.over || b.protein - a.protein; });
  return fits.concat(over);
}

function whole(v) { if (v == null || v === '') return null; v = Math.round(+v); return isFinite(v) ? v : null; } // null stays null: +null would be 0
function nutField(id) { // the check in field, or null for a client without check in or without that column

}

function auto() {
  var t = localIso(), food = L.x.food, l = null;
  if (food && typeof food.left === 'function') { try { l = food.left(t); } catch (e) { l = null; } }
  if (l && whole(l.calories) != null) return { kcal: whole(l.calories), protein: whole(l.protein), raw: whole(l.calories), from: 'food' };
  var fk = nutField('calories'), fp = nutField('protein'), tk = tgt(fk, t);
  if (tk) {

    return { kcal: tk - Math.round(ek), protein: tp == null ? null : tp - Math.round(ep), raw: tk - Math.round(ek), from: ek || ep ? 'logged' : 'targets', ek: ek, ep: ep };
  }
  var pt = {}; try { pt = planTargets() || {}; } catch (e) { pt = {}; }
  if (num(pt.calories) > 0) return { kcal: whole(num(pt.calories)), protein: num(pt.protein) > 0 ? whole(num(pt.protein)) : null, raw: 1, from: 'plan' };

}
