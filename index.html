// the coach-only principle and source fields are left out. A struggle is [id, label, reflection, open question, tell Adam first,
// [three steps as [id, title, how, why]]].
var C = {
  q: [
    ["When you picture yourself six months from now, what would you love to be different?","For example: I want to keep up with my kids in the park without getting out of breath."],
    ["What made you decide that now is the right time to start?","For example: I got out of breath on the stairs and decided I wanted to feel fitter."],
    ["What matters most to you about reaching this goal?","For example: I want to stay active and independent as I get older."],
    ["How would your everyday life feel if this goes well?","For example: More energy at work and no more afternoon slump."],
    ["Who else feels the difference when you look after yourself?","For example: My family, because I am calmer and more present with them."],
    ["What would you like to be able to say about yourself a year from now?","For example: I kept going even when life got busy, and I am proud of that."]
  ],
  r: {
    imp: ["On a scale of 0 to 10, how important is this to you right now?",{"low":"What would need to change for this to feel a little more important to you?","mid":"What made you pick that number and not a lower one? What makes it matter that much?","high":"That clearly matters to you. What would help you act on it this week?"}],
    conf: ["On a scale of 0 to 10, how confident are you right now that you can stick with your plan?",{"low":"What is one small thing that would make this feel a bit more doable?","mid":"What made you pick that number and not a lower one? What is already working for you?","high":"What strengths or past wins will you lean on when life gets busy?"}]
  },
  wob: [
    "You wrote this: {why}",
    "Your reason, in your own words: {why}",
    "A reminder from you, to you: {why}",
    "In your own words, you said: {why}",
    "Hard moments pass. Your reason is still here: {why}",
    "One meal or one day does not undo your progress. Your why: {why}",
    "What you do next is your choice. This is what you said matters to you: {why}",
    "You might take a breath and read this again: {why}"
  ],
  wait: [
    "A glass of water.",
    "A short walk, even just around the house.",
    "Brushing your teeth.",
    "Texting or calling someone you like talking to.",
    "Stepping outside for some fresh air.",
    "Putting on a song you like and listening to the whole thing."
  ],
  passed: [
    "You noticed the craving and it eased. That is a skill, and it often gets easier with practice.",
    "You paused and noticed. Each time you do this, you learn a bit more about your cravings.",
    "If you are hungry, your next meal or snack from your plan is there for you.",
    "You might jot down what set it off, so you and Adam can spot any patterns."
  ],
  still: [
    "You paused and noticed, and that counts. Cravings do not always pass in ten minutes.",
    "If you want it, have it. It can fit into your day. Enjoy it without guilt.",
    "You can log it like any other food and carry on with your plan as normal. One choice does not undo your progress.",
    "If cravings often feel hard to manage, tell Adam. You do not have to sort it out alone."
  ],
  intro: "Cravings tend to rise, peak and then ease, a bit like a wave. This pause gives you ten minutes to notice what is happening before you decide what you want.",
  stages: [
    [0,"See if you can notice the craving without judging it. Where do you feel it in your body?"],
    [2,"You might try breathing slowly. How strong does it feel right now, from 0 to 10?"],
    [5,"Time to check in again. Is it stronger, weaker or about the same? Any of these is fine."],
    [8,"Are you hungry, or are you tired, stressed or bored? If you are hungry, eating is a good choice. If it is something else, that is useful to know too."],
    [10,"Your ten minutes are up. Whatever you choose now is your call."]
  ]
};
var S = [
  ["evening-hunger","Hungry in the evening","Evenings are when hunger tends to catch up with you, even on days that went well.","What has helped, even a little, on evenings when the hunger felt easier?",1, [
    ["evening-hunger-1","Keep some of today's food for later","You could keep part of a planned meal or snack from today for after dinner. It is the same food, just at the time you tend to want it most.","Having something already planned for the evening can take the edge off while keeping you within your plan."],
    ["evening-hunger-2","Add a big portion of vegetables to dinner","You could add a large handful of salad or vegetables alongside your planned dinner tonight. If you are hungry most evenings, you could tell Adam, as your plan may need a change.","Foods with lots of water and fibre fill your plate and can help you feel full for fewer calories."],
    ["evening-hunger-3","Plan what you will do when hungry","You could finish this sentence and save it on your phone. If I get in from work hungry, then I will start with my next meal from my plan.","Deciding in advance means you are not making the choice when you are tired and hungry, and you know food is coming."]]],
  ["weekends","Weekends throw me off","Your weekdays have a rhythm, and weekends pull you in lots of different directions.","What is one part of your weekend that feels easiest to keep the same?",0, [
    ["weekends-1","Keep one weekend meal the same","You could pick one meal on Saturday and Sunday, such as breakfast, and have it just as it is on your meal plan. That one meal is a good place to start.","One steady anchor gives the day some shape without taking the fun out of it."],
    ["weekends-2","Shop for the weekend on Thursday or Friday","You could use your shopping list before the weekend starts, so the food for your planned meals is already in the house.","When the right food is at home and easy to reach, it is more likely to be what you choose."],
    ["weekends-3","Take food from your plan when out","You could write one line for the weekend. For example: if I am out for most of Saturday, then I will take food from my plan with me.","Having food from your plan with you means you are not relying on whatever is nearby when hunger hits."]]],
  ["eating-out","Eating out knocks me off","Eating out is part of your life, and it can be hard to know what fits your plan.","When you have eaten out before and felt good about it afterwards, what did you do?",0, [
    ["eating-out-1","Look at the menu before you go","You could look up the menu online earlier in the day and choose your meal while you are calm and not hungry.","Choosing ahead takes the pressure off ordering on the spot."],
    ["eating-out-2","Build your order around a protein","One option is a dish built around a protein, such as chicken, fish, steak, eggs or tofu, with vegetables or salad on the side. You can still have the rice, chips or bread you enjoy.","Protein and vegetables tend to be filling, so you can enjoy the meal and still feel satisfied."],
    ["eating-out-3","Log your best guess afterwards","You could add the meal to your log with your best guess at the numbers. A rough entry is more useful than no entry.","Keeping a record, even a rough one, helps you and Adam see the whole week."]]],
  ["no-time-to-train","No time to train","Your week is full, and finding time for a whole session can feel out of reach.","If you had twenty spare minutes this week, when would they most likely be?",0, [
    ["no-time-to-train-1","Do a shorter version of your session","You could pick the first two or three exercises from today's plan and do just those. You can stop there, or carry on if you have time.","A short session still counts, and it keeps the habit going."],
    ["no-time-to-train-2","Book your sessions into your calendar","You could open your calendar now and put this week's sessions in like appointments, with a time and a place.","A set time and place can make it more likely that the session happens."],
    ["no-time-to-train-3","Pack your gym bag the night before","You could put your kit by the door or in the car tonight, so it is ready to go.","Fewer small jobs between you and the session makes it easier to get started."]]],
  ["low-motivation-to-train","Not feeling like training","Part of you wants to train, and part of you is just not feeling it at the moment.","What has made training feel worth it for you in the past?",1, [
    ["low-motivation-to-train-1","Agree to just do the warm-up","You could tell yourself you will only do the warm-up today. If you still do not want to carry on after that, you can stop there.","Starting is often the hardest part, and a small start can make the rest feel easier."],
    ["low-motivation-to-train-2","Write down your own reason to train","You could write one line in your notes about why training matters to you, in your own words, and read it before your next session.","Reasons that come from you tend to keep you going for longer than reasons that come from other people."],
    ["low-motivation-to-train-3","Tell Adam what is in the way","You could send Adam a short message about how training feels at the moment. If anything hurts or a niggle is holding you back, you could mention that too.","Adam can change the plan so it fits how you feel and what your body needs right now."]]],
  ["missing-steps","Missing my step target","The steps matter to you, and some days just end before you get there.","Which part of your day already has a bit of walking in it?",0, [
    ["missing-steps-1","Add a ten-minute walk after one meal","You could pick one meal today and go for a ten-minute walk straight after it.","Linking a walk to something you already do each day helps it become automatic over time."],
    ["missing-steps-2","Leave your trainers by the door","You could put your trainers and coat by the front door tonight, so a short walk is easy to start.","Seeing your shoes ready can prompt you to head out, and it takes away one small job."],
    ["missing-steps-3","Check your steps at lunchtime","You could look at your step count at lunch, so you know how many are left for the afternoon. You can log the full total tonight.","Checking in halfway gives you time to catch up, rather than finding out at bedtime."]]],
  ["tracking-chore","Tracking food is a chore","Logging every meal takes effort, and it can start to feel like homework.","What would make tracking feel lighter for you this week?",0, [
    ["tracking-chore-1","Log the whole day in one go","You could fill in your whole day in one go this evening, at a time that suits you. One sitting can feel lighter than logging all day.","A smaller job is easier to keep doing, and you can build from there."],
    ["tracking-chore-2","Log each meal as soon as you finish","You could add to your log straight after you eat, before you get up from the table.","Tying the log to the end of the meal means you do not have to remember it later."],
    ["tracking-chore-3","Let a rough entry count","When you are not sure of an amount, you could log your best guess and move on. A rough entry still tells you and Adam a lot.","A rough record still shows you and Adam the pattern of your week."]]],
  ["cravings-snacking","I keep snacking","Cravings can feel strong and sudden, and it is tiring to keep pushing back against them.","What has helped you get through a craving before, even once?",1, [
    ["cravings-snacking-1","Move tempting snacks out of sight","You could put tempting snacks in a cupboard or on a high shelf. Fruit or food from your plan could go where you will see it first.","You may be more likely to eat the food that is easiest to see and reach."],
    ["cravings-snacking-2","Ride out a craving for ten minutes","Next time a craving comes, you could set a ten-minute timer and notice where you feel it in your body. After that the choice is yours, and if you are hungry you could eat something from your plan.","Cravings often build, peak and fade, and noticing them can make them easier to ride out."],
    ["cravings-snacking-3","Tell Adam about the cravings","If cravings feel hard to manage, or you sometimes feel out of control around food, you could tell Adam. A short message or a line in your weekly check in is enough.","Adam can look at your plan with you and find changes that make this easier."]]],
  ["poor-sleep","Not sleeping well","Poor sleep makes everything else feel harder, from hunger to training.","What has helped you sleep a little better in the past?",1, [
    ["poor-sleep-1","Charge your phone outside the bedroom","You could charge your phone in another room tonight, or at least out of reach of the bed.","Keeping your phone away from the bed can make it easier to wind down."],
    ["poor-sleep-2","Have your last coffee a little earlier","You could try having your last coffee, tea or energy drink by early afternoon for a few days and see how you sleep.","Caffeine stays in your body for hours and can make it harder to fall asleep."],
    ["poor-sleep-3","Write tomorrow's jobs down before bed","If your mind is busy at night, you could write a quick list of tomorrow's jobs before you go to bed. If pain, worry or low mood is keeping you awake, you could tell Adam.","Getting your thoughts onto paper can help clear your mind for sleep."]]],
  ["stress-eating","Eating when stressed","When stress builds up, food can feel like the quickest way to get some comfort, and that makes sense.","What else has helped you feel even a little calmer when things got stressful?",1, [
    ["stress-eating-1","Pause for five slow breaths first","When you notice stress pulling you towards food, you could pause and take five slow breaths. Then you could ask yourself what would help most right now.","A short pause gives you a moment to choose, rather than acting on autopilot."],
    ["stress-eating-2","Pick one other way to unwind","You could choose one thing that calms you, such as a short walk, a shower or calling a friend. Then plan it: if I feel stressed after work, then I will do that first.","A ready plan can give you something else to turn to."],
    ["stress-eating-3","Let Adam know how you are","If stress or low mood has been hanging around, or eating feels out of your control, you could send Adam a message. You do not have to explain everything.","Adam can adjust your plan and help you find the right support."]]],
  ["alcohol-social","Nights out and drinks","You want to enjoy time with friends, and you also want to keep making progress.","What would a night out look like that you still felt happy about the next morning?",0, [
    ["alcohol-social-1","Decide your number before you go","You could choose how many drinks you will have before you leave the house, and tell a friend if that helps.","A limit set in advance can be easier to stick to than one made in the moment."],
    ["alcohol-social-2","Alternate each drink with a soft drink","You could have a glass of water or a soft drink between each alcoholic drink, or try a lower-strength or alcohol-free option.","This slows the pace, which can mean fewer drinks over the evening without missing out."],
    ["alcohol-social-3","Have a planned meal before you go out","You could have one of your planned meals before you head out, rather than going out hungry.","Eating first means you are not out on an empty stomach, and one planned meal is already done."]]],
  ["giving-up","I feel like giving up","Today did not go the way you hoped, and it makes sense that you feel like throwing it all in.","What would you say to a friend who had the day you just had?",1, [
    ["giving-up-1","Treat this as one day, not the week","You could write down one thing that did go to plan this week. Your next meal is a fresh start.","Being kind to yourself after a hard day can make it easier to carry on."],
    ["giving-up-2","Do one small thing from your plan","You could pick the easiest thing on your plan for tomorrow, such as your first meal or a short walk. That one thing is enough.","A small win can help you feel back in control."],
    ["giving-up-3","Send Adam a quick message","You could send Adam a short message, even just a few words about how today went. If you have been feeling low for a while, you could mention that too.","You do not have to work it out on your own, and Adam would rather hear from you."]]]
];

// Everything here stays on this phone (L.get / L.set). Nothing new goes to the sheet: the only thing that can leave the
// phone is a mailto the client sends from their own mail app.
// Keys: why:text {text, q, at}, why:draft (unsaved typing or null), why:rulers {imp|conf: {n, at, a:{low,mid,high}}},
// why:pause {at: ms} while a pause runs, why:tally [{d, p}], why:focus:<Monday iso> {s, st, days[]}.
var MIN = 60000, LEN = 10 * MIN, STALE = 60 * MIN, KIDS = ['today', 'checkin', 'lab-why'];
var cur = '', from = {}, ui = { q: 0, pick: '', change: false, result: '' }, timer = 0, R = {};

function today() { return localIso(); }
function monday(iso) { return addDaysIso(iso, -((dateOf(iso).getDay() + 6) % 7)); } // Monday to Sunday from the phone's clock, so a stale cached data.week cannot file a tick under the wrong week
function quote(t) { return '\u201c' + t + '\u201d'; }
function cut(t, n) { return t.length > n ? t.slice(0, n).replace(/\s+\S*$/, '') + '\u2026' : t; }
function chev() { return icon('chev').replace('<svg', '<svg aria-hidden="true"'); }
function arr(v) { return Array.isArray(v) ? v : []; }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
function day(at) { return typeof at === 'string' && /^\d{4}-\d\d-\d\d$/.test(at) ? fmtDate(at) : ''; } // a stored date in any other shape prints nothing, never "Invalid Date"
function qi(n) { n = Math.floor(+n); return n >= 0 && n < C.q.length ? n : 0; } // a stored question number that is not one of ours reads as the first question
function adam() { var m = /mailto:([^"?]+)/.exec(MESSAGE_ADAM || ''); return m ? m[1] : ''; } // the address from MESSAGE_ADAM at call time, so it follows any change there

function why() { var w = L.get('why:text', null); return w && typeof w.text === 'string' && w.text.trim() ? w : null; }
function draftText() { var d = L.get('why:draft', null); return typeof d === 'string' ? d : null; }
function rulers() { var r = L.get('why:rulers', null); return r && typeof r === 'object' ? r : {}; }
function band(n) { return n <= 3 ? 'low' : n <= 6 ? 'mid' : 'high'; } // 0 to 3, 4 to 6, 7 to 10

function struggle(id) { for (var i = 0; i < S.length; i++) if (S[i][0] === id) return S[i]; return null; }
function stepOf(s, id) { for (var i = 0; i < s[5].length; i++) if (s[5][i][0] === id) return s[5][i]; return null; }
function fkey(mon) { return 'why:focus:' + mon; }
function focus(mon) { // this week's pick, or null; a stored id the content no longer has reads as no focus, never a broken card
  mon = mon || monday(today());
  var f = L.get(fkey(mon), null), s = f && struggle(f.s), st = s && stepOf(s, f.st), end = addDaysIso(mon, 6);
  return st ? { s: s, st: st, days: arr(f.days).filter(function (d) { return typeof d === 'string' && d >= mon && d <= end; }) } : null;
}
function setFocus(mon, s, st, days) { L.set(fkey(mon), s ? { s: s, st: st, days: days || [] } : null); }

// The pause is a stored start time; what is left is always worked out from the clock, so leaving the app cannot stop it.
function pauseAt() {
  var p = L.get('why:pause', null), at = p && +p.at;
  if (!at) return 0;
  if (Date.now() - at > STALE) { L.set('why:pause', null); return 0; } // an hour on, the moment has gone: drop it quietly, uncounted
  return at;
}
function gone(at, now) { return Math.max(0, (now == null ? Date.now() : now) - at); } // a clock set back never shows more than ten minutes
function left(at, now) { return Math.max(0, LEN - gone(at, now)); }
function stageLine(ms) { var l = C.stages[0][1]; C.stages.forEach(function (s) { if (ms >= s[0] * MIN) l = s[1]; }); return l; }
function clock(ms) { var s = Math.ceil(ms / 1000), r = s % 60; return Math.floor(s / 60) + ':' + (r < 10 ? '0' : '') + r; }
function tally() { return arr(L.get('why:tally', [])).filter(function (t) { return t && typeof t.d === 'string'; }); }
function tallyLine() {
  var mon = monday(today()), w = tally().filter(function (t) { return t.d >= mon; }), p = w.filter(function (t) { return t.p; }).length;
  return w.length ? plural(w.length, 'pause', 'pauses') + ' this week, ' + p + ' passed' : '';
}

function line() { // one wobble line with their why in it, the same all day so it does not flicker between renders
  var w = why(); if (!w) return '';
  var n = Math.floor(dateOf(today()).getTime() / 864e5);
  return C.wob[n % C.wob.length].replace('{why}', quote(w.text.trim()));
}
function mailto(f) {
  var body = 'Hi Adam,\n\nThe hardest thing right now: ' + f.s[1] + '.\nThe small step I picked: ' + f.st[1] + '.\nDone on ' +
    f.days.length + ' of 7 days so far this week.\n';
  return 'mailto:' + adam() + '?subject=' + encodeURIComponent('My focus this week') + '&body=' + encodeURIComponent(body);
}

// One writer for all three screens: painting the screen that is already up keeps the scroll place and skips the entrance.
function paint(name, body) {
  var again = cur === name && view.screen === name, y = document.body.scrollTop;
  $('app').innerHTML = '<section class="screen sub' + (again ? ' again" style="--since:-9999ms' : '') + '">' + body + '</section>';
  if (again) document.body.scrollTop = y;
}
function back(name) { // a child screen goes back where it was opened from: Today, Check in or My why
  if (name === 'why') return 'today';
  if (cur !== 'lab-' + name && KIDS.indexOf(cur) > -1) from[name] = cur;
  return from[name] || 'today';
}
function redraw(name) { if (view.screen === 'lab-' + name) R[name](); }
function stopTimer() { if (timer) { clearInterval(timer); timer = 0; } }
function tick() { // only the time and the stage line change in place; the end repaints once
  try {
    var c = $('lab-why-clock'), at = pauseAt();
    if (!c || view.screen !== 'lab-pause') return stopTimer();
    if (!at || !left(at)) { stopTimer(); return redraw('pause'); }
    c.textContent = clock(left(at));
    var s = $('lab-why-stage'), l = stageLine(gone(at)); if (s && s.textContent !== l) s.textContent = l;
  } catch (e) { stopTimer(); console.warn('trial why timer: ' + e.message); }
}
function links() {
  var f = focus(), at = pauseAt();
  return '<h2 class="sec">When it gets hard</h2><div class="list">' +
    '<button class="row" data-go="lab-pause"><span class="l">Craving pause<span>' + (at ? (left(at) ? 'Running, ' + plural(Math.ceil(left(at) / MIN), 'minute', 'minutes') + ' left' : 'Your ten minutes are up') : 'Ten minutes before you decide') + '</span></span>' + chev() + '</button>' +
    '<button class="row" data-go="lab-focus"><span class="l">This week\'s focus<span>' + esc(f ? f.st[1] : 'Pick one small step') + '</span></span>' + chev() + '</button></div>';
}

/* ---------- My why ---------- */
function ruler(k) {
  var r = rulers()[k], n = r && typeof r.n === 'number' ? r.n : -1, q = C.r[k], h = '<div class="lab-why-ruler"><p class="lab-why-rq">' + esc(q[0]) + '</p><div class="scale lab-why-scale">';
  for (var i = 0; i <= 10; i++) h += '<button class="' + (i === n ? 'sel' : '') + '" data-lab="why-rate" data-arg="' + k + '" data-n="' + i + '" aria-pressed="' + (i === n) + '">' + i + '</button>';
  h += '</div>';
  if (n > -1) {
    var a = (r.a && typeof r.a[band(n)] === 'string') ? r.a[band(n)] : '';
    h += '<p class="lab-why-fq">' + esc(q[1][band(n)]) + '</p><input class="lab-why-line" data-lab-in="why-ans" data-arg="' + k + '" maxlength="200" autocomplete="off" placeholder="Optional, one line is plenty" aria-label="' + esc(q[1][band(n)]) + '" value="' + esc(a) + '">' +
      '<p class="lab-why-kept">You picked ' + n + (day(r.at) ? ' on ' + esc(day(r.at)) : '') + '.</p>';
  }
  return h + '</div>';
}
R.why = function () {
  var w = why(), dr = draftText(), edit = !w || dr !== null, h;
  h = topBar('My why', 'In your own words', back('why'));
  if (edit) {
    var q = C.q[qi(ui.q)];
    h += '<p class="lab-why-ask">' + esc(q[0]) + '</p>' + '<button class="lab-why-link lab-why-other" data-lab="why-next" data-arg="1">Try a different question</button>' +
      '<label class="field"><textarea data-lab-in="why-draft" maxlength="500" placeholder="' + esc(q[1]) + '" aria-label="Your answer, in your own words">' + esc(dr || '') + '</textarea></label>' +
      '<p class="lab-why-kept">Kept on your phone, in your words. You can change it any time.</p>' +
      '<div class="lab-why-acts"><button class="btn strong" data-lab="why-save" data-arg="1">Save my why</button>' + (w ? '<button class="btn quiet" data-lab="why-cancel" data-arg="1">Keep what I had</button>' : '') + '</div>';
  } else {
    h += '<figure class="lab-why-quote"><blockquote>' + esc(quote(w.text.trim())) + '</blockquote>' + (day(w.at) ? '<figcaption>' + esc(day(w.at)) + '</figcaption>' : '') + '</figure>' +
      '<button class="btn auto quiet lab-why-edit" data-lab="why-edit" data-arg="1">Change it</button>' +
      '<h2 class="sec">Two quick numbers<span>for you, not a test</span></h2>' + ruler('imp') + ruler('conf');
  }
  paint('lab-why', h + links());
};
L.act('why-next', function () { ui.q = (ui.q + 1) % C.q.length; redraw('why'); });
L.input('why-draft', function (el) { L.set('why:draft', String(el.value)); }); // every key stroke is kept, so leaving mid-sentence loses nothing
L.act('why-save', function () {
  var el = document.querySelector('[data-lab-in=why-draft]'), t = String(el ? el.value : draftText() || '').trim();
  if (!t) { toast('Write a few words first'); return; }
  L.set('why:text', { text: t.slice(0, 500), q: qi(ui.q), at: today() }); L.set('why:draft', null);
  redraw('why'); document.body.scrollTop = 0; toast('Saved');
});
L.act('why-edit', function () { var w = why(); if (!w) return; ui.q = qi(w.q); L.set('why:draft', w.text); redraw('why'); document.body.scrollTop = 0; });
L.act('why-cancel', function () { L.set('why:draft', null); redraw('why'); });
L.act('why-rate', function (el) {
  var k = el.getAttribute('data-arg'), n = +el.getAttribute('data-n');
  if (!C.r[k] || !(n >= 0 && n <= 10)) return;
  var r = rulers(), o = r[k] || {}; r[k] = { n: n, at: today(), a: o.a && typeof o.a === 'object' ? o.a : {} }; // answers are kept per band, so a typed line never sits under a different question
  L.set('why:rulers', r); redraw('why');
});
L.input('why-ans', function (el) {
  var k = el.getAttribute('data-arg'), r = rulers(); if (!r[k]) return;
  r[k].a = r[k].a && typeof r[k].a === 'object' ? r[k].a : {}; r[k].a[band(r[k].n)] = String(el.value).slice(0, 200); L.set('why:rulers', r);
});

/* ---------- Craving pause ---------- */
R.pause = function () {

/* ---------- what the client sees ---------- */
var FOOT = 'This is a link in your own logs, not proof of cause.';
function card(o, ex) {
  var tag = ex ? '<span class="lab-pattern-tag">Example, not your data</span>' : '';
  var top = '<div class="card lab-pattern-card lab-pattern-' + esc(o.state) + '">' + tag + '<span class="lab-pattern-title">' + esc(o.title) + '</span>';
  if (o.state === 'found') return top + '<b class="lab-pattern-head">' + esc(o.head) + '</b><p class="meta">' + esc(o.text) + '</p>' + (o.ask ? '<p class="lab-pattern-ask">' + esc(o.ask) + '</p>' : '') + '</div>';
  var bar = o.state === 'short' && o.need ? '<span class="lab-pattern-bar" aria-hidden="true"><i style="width:' + Math.round(o.of / MIN_DAYS * 100) + '%"></i></span>' : '';
  return top + '<b class="lab-pattern-quiet">' + esc(o.text) + '</b>' + bar + (o.state === 'none' && o.nums ? '<p class="meta">' + esc(o.nums) + '</p>' : '') + '</div>';
}

function draw(still) {
  var c = data && data.checkIn, hist = c ? sync() : {}, n = logged(clean(hist));
  var html = '<section class="screen' + (still ? ' sub lab-pattern-still' : '') + '">' + topBar('Your patterns', c ? days(n, 'day') + ' of logs on this phone' : '', L.screens.patterns.parent);
  html += '<p class="meta lab-pattern-intro">Links the app spots in your own logs. Each one needs ' + MIN_DAYS + ' days of logs, with ' + MIN_SIDE + ' on each side, before it says anything.</p>';
  if (!c) html += '<p class="note">Your check in is not switched on in the app yet, so there are no logs to look at. ' + MESSAGE_ADAM + '.</p>';
  html += '<div class="list lab-pattern-switch"><button class="sw' + (example ? ' on' : '') + '" role="switch" aria-checked="' + example + '" data-lab="pattern-example" data-arg="1"><span>Show an example</span><span class="knob"></span></button></div>';
  if (example) html += '<p class="note warn" id="labPatternEx">Example, not your data. Made-up numbers, to show what a pattern looks like.</p>';
  var list = example ? all(sample()) : c ? all(hist) : [];
  if (list.length) html += '<div class="lab-pattern-list">' + list.map(function (o) { return card(o, example); }).join('') + '</div><p class="note">' + FOOT + '</p>';
  $('app').innerHTML = html + '</section>';
}

L.x.pattern = { find: find, all: all, best: best, merge: merge, sync: sync, sample: sample, key: KEY };
L.feature({ id: 'pattern', name: 'Your patterns', where: 'Progress, under the chart, once a pattern is clear', go: 'lab-patterns' });
L.on('data', function () { sync(); });
L.screen('patterns', function () { example = false; draw(false); }, { parent: 'progress' });
L.act('pattern-example', function () { // redrawn in place: no slide-in, scroll kept; focus goes back to the new switch
  example = !example; draw(true);
  var b = document.querySelector('[data-lab=pattern-example]'); if (b) b.focus();
});
L.slot('progress:cards', function () {
  if (!data || !data.checkIn) return '';
  var top = best(sync(), 2); if (!top.length) return ''; // quiet until something is clear
  return '<div class="lab-pattern-wrap"><div class="sechead"><b>Your patterns</b></div>' +
    '<div class="lab-pattern-list">' + top.map(function (o) { return card(o, false); }).join('') + '</div>' +
    '<p class="meta lab-pattern-foot">' + FOOT + '</p>' +
    '<div class="card lab-pattern-link"><button class="linkrow" data-go="lab-patterns">See all patterns' + icon('chev') + '</button></div></div>';
});
});
LAB.mod('tour', function (L) {
// Trial module "tour": a first-run tour of the five tabs, a "what's new" sheet, and the screen that lists every trial feature.
// Nothing here is sent to the sheet: the only things kept are three phone-only flags (L.get / L.set).

// The tour, one step per dock tab, written from what each tab really shows.
var STEPS = [
  // plain: the line for a client with no daily check in, whose Today is only this week's sessions (no habits, no Log);
  // nohab: check in but no Habits tab on their sheet, so Today has no habits card
  { tab: 'today', title: 'Today', text: 'Start here each day. See how this week is going, tick your habits and log your numbers.',
    plain: 'Start here each day. Your training for this week is listed here.',
    nohab: 'Start here each day. See how this week is going and log your numbers.' },
  // self: the line for a client who runs their own training, whose Workout tab is a list of sessions to tick off
  { tab: 'workout', title: 'Workout', text: 'Your sessions for this week. Tap one to start and log each set as you go.', // no "numbers to beat": week 1 has none
    self: 'Your training for this week. Tick each session off when it is done.' },
  // Plan and Check in differ per client (parts may be switched off), so these lines promise nothing that may be missing
  { tab: 'plan', title: 'Plan', text: 'What Adam has set for you, all in one place.' },
  { tab: 'checkin', title: 'Check in', text: 'Your weekly check in, due by Sunday, 12 noon. Everything Adam needs from you is listed here.' },
  // with no daily check in there is no weight trend or averages on Progress, so the plain line names none of them
  { tab: 'progress', title: 'Progress', text: 'Your weight trend, measurements and weekly averages, all in one place. Tap Done to go back to Today.',
    plain: 'A look back at how your weeks have gone. Tap Done to go back to Today.' }
];
// What's new. To announce a feature later, add an entry with a newer id (an ISO date) and its items { name, line, go }:
// the newest id is the one shown. This first entry has no items of its own, so it lists the trial features on this phone.
var NEWS = [{ id: '2026-11-25', title: 'New to try', items: null }];

var tip = null, at = 0, sheet = null, timer = 0, until = 0, stepAt = 0;

function others() { return L.features.filter(function (f) { return f && f.id !== 'tour' && f.name; }); } // this module is the list, not an entry in it
function canGo(go) { return typeof go === 'string' && !!go && typeof RENDER[go.split(':')[0]] === 'function'; } // show() throws on a screen that is not registered
function latest() { return NEWS.reduce(function (a, b) { return b.id > a.id ? b : a; }); }
function itemsOf(n) { return n.items || others().map(function (f) { return { name: f.name, line: f.where, go: f.go }; }); }
function seen() { var s = L.get('tour:news', []); return Array.isArray(s) ? s : []; }
// the core shows the habits card only when the check in has a habits field (it is dropped when the sheet has no Habits tab)
function hasHabits() { var c = data.checkIn; return !!(c && asList(c.fields).some(function (f) { return f && f.kind === 'habits'; })); }
function asList(x) { return Array.isArray(x) ? x : []; } // a stored session of an odd shape must not stop the tour with an error
function live(s) { // touched in the last three hours with exercises left: the client is between sets, not new to the app
  return !!(s && s.lastAt && Date.now() - s.lastAt < 3 * 36e5 && asList(s.order).some(function (n) {
    return asList(s.done).indexOf(n) < 0 && asList(s.skipped).indexOf(n) < 0;
  }));
}
// The stored sessions count too: after a reload (a phone dropping the tab between sets) sess is null but the session is not over.
function midSession() { return live(sess) || (data.days || []).some(function (d) { return !!d && live(load(sessKey(d.name), null)); }); }
function blocked() { return !TABS[view.screen] || momentUp() || !!document.querySelector('.confirm') || midSession(); }

// Called a moment after data arrives or a screen is shown, so the screen has settled first.
function check() {
  timer = 0;
  if (tip || blocked()) return;
  if (!L.get('tour:seen', false)) { if (view.screen === 'today') start(); return; } // only from Today: never pull the client off a tab they just chose
  var n = latest();
  if (seen().indexOf(n.id) < 0 && itemsOf(n).length) news();
}
function later() { clearTimeout(timer); timer = setTimeout(check, 700); }

function start() {
  closeSheet();
  L.set('tour:seen', true); // once per phone, even if the app is closed half way through
  at = 0; step();
}
function step() {
  var s = STEPS[at], last = at === STEPS.length - 1;
  if (!tip) { // on the body, not in #app, which every show() rewrites
    tip = document.createElement('div'); tip.className = 'lab-tour-tip';
    tip.setAttribute('role', 'dialog'); tip.setAttribute('aria-label', 'App tour'); tip.setAttribute('aria-describedby', 'labTourText');
    tip.addEventListener('keydown', function (e) { if (e.key === 'Escape') end(); });
    document.body.appendChild(tip);
  }
  show(s.tab); // first, so the dock marks this tab before the card points at it
  var text = s.self && selfMode() ? s.self : s.plain && !data.checkIn ? s.plain : s.nohab && !hasHabits() ? s.nohab : s.text; // picked when shown, from how this client is set up
  stepAt = Date.now();
  tip.innerHTML = '<span class="lab-tour-n">' + (at + 1) + ' of ' + STEPS.length + '</span><b>' + esc(s.title) + '</b><p id="labTourText">' + esc(text) + '</p>' +
    '<div class="lab-tour-btns">' + (last ? '' : '<button class="btn quiet" data-lab="tour-skip">Skip</button>') +
    '<button class="btn strong" data-lab="tour-next">' + (last ? 'Done' : 'Next') + '</button></div><i class="lab-tour-caret" aria-hidden="true"></i>';
  var b = document.querySelector('#dock button.on'), r = b && b.getBoundingClientRect(), t = tip.getBoundingClientRect(), c = tip.querySelector('.lab-tour-caret');
  if (r && r.width) c.style.left = Math.max(20, Math.min(t.width - 20, r.left + r.width / 2 - t.left)) + 'px'; else c.hidden = true; // the caret points at the tab
  var nb = tip.querySelector('[data-lab="tour-next"]'); try { nb.focus({ preventScroll: true }); } catch (e) { nb.focus(); }
}
// When the card or the sheet goes, the screen under it is live at once: the second tap of a double tap on Done, Skip or
// Got it would tick a habit or open another screen. So taps are swallowed for a moment after either goes.
function hush() { until = Date.now() + 400; }
document.addEventListener('click', function (e) { if (Date.now() < until) { e.stopPropagation(); e.preventDefault(); } }, true);
function end() { if (tip) { tip.remove(); tip = null; hush(); } }

function news() {
  if (sheet || tip) return; // never on top of the tour
  var n = latest(), items = itemsOf(n);
  if (!items.length) return toast('Nothing new to show right now.');
  sheet = document.createElement('div'); sheet.className = 'confirm lab-tour-news'; // the page's bottom sheet look
  sheet.setAttribute('role', 'dialog'); sheet.setAttribute('aria-modal', 'true'); sheet.setAttribute('aria-label', 'What\'s new');
  sheet.innerHTML = '<div class="box"><b>' + esc(n.title) + '</b><p>' + (items.length === 1 ? 'Try it' : 'Try them') + ' for a few days and tell Adam what you think.</p><div class="lab-tour-items">' + items.map(function (x) {
    return '<div class="lab-tour-item"><span><strong>' + esc(x.name) + '</strong>' + (x.line ? '<small>' + esc(x.line) + '</small>' : '') + '</span>' +
      (canGo(x.go) ? '<button class="btn auto" data-lab="tour-open" data-arg="' + esc(x.go) + '" aria-label="Open ' + esc(x.name) + '">Open</button>' : '') + '</div>';
  }).join('') + '</div><button class="btn strong" data-lab="tour-gotit">Got it</button></div>';
  sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); }); // a tap on the backdrop closes it, like confirmSheet
  sheet.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
  document.body.appendChild(sheet);
  var g = sheet.querySelector('[data-lab="tour-gotit"]'); try { g.focus({ preventScroll: true }); } catch (e) { g.focus(); }
}
function closeSheet() { // any way out counts as seen, so it never comes back on the next screen
  if (!sheet) return;
  var s = seen(), id = latest().id; if (s.indexOf(id) < 0) { s.push(id); L.set('tour:news', s); }
  sheet.remove(); sheet = null; hush();
}

L.feature({ id: 'tour', name: 'Trial features', where: 'Today, at the bottom', go: 'lab-new' });
L.x.tour = { start: start, news: news, steps: STEPS };

// Next is redrawn in the same place, so the second tap of a double tap would skip a step (or hit Done): ignore it.
// Only Next waits; hush() here would deaden the whole page after every step.
L.act('tour-next', function () {
  if (momentUp() || document.querySelector('.confirm')) return; // Enter on the focused Next must not move the tour behind an open question
  if (Date.now() - stepAt < 400) return;
  if (at < STEPS.length - 1) { at++; return step(); }
  end(); show('today'); // Done: back to Today, then what's new
});
L.act('tour-skip', function () { end(); });
L.act('tour-replay', function () { start(); hush(); }); // Today is drawn under the finger: the second tap must not open Log
L.act('tour-again', function () { news(); });
L.act('tour-gotit', function () { closeSheet(); });
L.act('tour-open', function (el) { var go = el.getAttribute('data-arg'); closeSheet(); if (canGo(go)) show(go); });

L.on('data', later);
L.on('shown', function (name) {
  if (tip) { if (name !== STEPS[at].tab) end(); return; } // the client went somewhere else: the tour gets out of the way, and what's new waits
  later();
});
document.addEventListener('click', function (e) { if (tip && e.target.closest && e.target.closest('#dock button')) end(); }); // a dock tap, even on the same tab, ends the tour

L.slot('today:cards', function () {
  var n = others().length;
  return '<div class="list lab-tour-row seq-i" style="--i:14"><button class="row" data-go="lab-new"><span class="l">Trial features' + (n ? ' (' + n + ')' : '') +
    '<span>' + (n ? 'New parts of the app to try' : 'Replay the app tour') + '</span></span>' + icon('chev') + '</button></div>';
}, 90);

L.screen('new', function () {
  var fs = others();
  var html = '<section class="screen">' + topBar('Trial features', fs.length ? fs.length + ' to try' : 'Nothing to try right now', L.screens['new'].parent) +
    '<p class="meta lab-tour-lead">New parts of the app, switched on for you to try first.</p>';
  html += fs.length ? '<div class="list lab-tour-list">' + fs.map(function (f) {
    return '<div class="row"><span class="l">' + esc(f.name) + (f.where ? '<span>' + esc(f.where) + '</span>' : '') + '</span>' +
      (canGo(f.go) ? '<button class="btn auto" data-go="' + esc(f.go) + '" aria-label="Open ' + esc(f.name) + '">Open</button>' : '') + '</div>';
  }).join('') + '</div>' : '<p class="note">No trial features are switched on right now.</p>';
  html += '<div class="sechead"><b>The tour</b></div><div class="lab-tour-acts"><button class="btn" data-lab="tour-replay">Replay the tour</button>' +
    '<button class="btn quiet" data-lab="tour-again">Show what\'s new again</button></div>';
  $('app').innerHTML = html + '</section>';
}, { parent: 'today' });
});
/* lab:mods:end */

/* ---------- boot ---------- */
function boot() { if (data) resume(); refresh(); }
var refreshing = false;
function refresh() {
  if (refreshing) return; refreshing = true;
  var bootAt = Date.now();
  api.getData().then(function (fresh) {
    refreshing = false;
    if (data && (lastWrite > bootAt || ciPending())) { fresh.checkIn = data.checkIn; fresh.tasks = data.tasks; fresh.measurements = data.measurements; } // a save landed after this snapshot was taken
    var first = !data; data = fresh; store('cw:data', data); fetchedOn = localIso(); fetchedAt = Date.now();
    if (data.savedTo) SAVED_TO = data.savedTo;
    if (data.title) document.title = data.title;
    loadPlan();
    LAB.start(); LAB.fire('data', data); // trial screens are registered before the render below; both do nothing without the switch
    if (first) resume(); else if (TABS[view.screen]) { var y = document.body.scrollTop; resume(); document.body.scrollTop = y; } // a background refresh must not move the page under the finger
    else if (view.screen === 'log' && !logDirty()) renderLog();
    flush();
  }, function (err) {
    refreshing = false;
    if (!data) $('app').innerHTML = '<div class="err"><b>Could not load your plan.</b>' + esc((err && err.message) || 'Check your signal and reopen the link.') + '</div>';
    else { syncState.error = 'offline'; renderSync(); }
  });
}
function resume() { var v = view.screen; if (!v || !TABS[v]) return show('today'); show(v); }
function onResume() { // a page left open overnight: new day, new data, but never under a half-typed form or an open session
  if (document.hidden) return; if (!data) return refresh(); if (!TABS[view.screen]) return; // a failed first load tries again when the client comes back
  if (localIso() !== fetchedOn || Date.now() - fetchedAt > 6e5) refresh();
}
document.addEventListener('visibilitychange', onResume);
window.addEventListener('pageshow', function (e) { if (e.persisted) onResume(); });
boot();

function mockApi() { // public copy: a link without ?s and ?k has nothing to load
  return { getData: function () { return Promise.reject(new Error('This link is missing its details. Ask Adam for your workout link.')); } };
}
</script>
