<!DOCTYPE html>

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="AMS Training">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* tokens:start */
/* AMS Johnston Coaching client app: design tokens. Source of truth for every colour, size, radius, elevation and
   motion value in the app. Index.html uses these custom properties and never raw values.
   Brand (July 2026): forest #1F7A36, emerald #2BA84A, charcoal #222222, off-white #F2F2F2, burgundy #6B2D34.
   Type: Montserrat (brand header face from the sheet design language), Arial fallback. Numbers always tabular.
   Contrast: every pair below checked with design/contrast.js (WCAG AA 4.5:1 text, 3:1 large). */

:root {
  /* Brand */
  --forest: #1F7A36;
  --emerald: #2BA84A;
  --charcoal: #222222;
  --offwhite: #F2F2F2;
  --burgundy: #6B2D34;

  /* Light theme (default) */
  --canvas: var(--offwhite);        /* page */
  --surface: #FFFFFF;               /* cards, inputs */
  --surface-2: #E6EAE6;             /* pressed, strips, track */
  --line: #D6DBD6;                  /* hairlines */
  --ink: var(--charcoal);           /* text 14.6:1 on canvas */
  --ink-muted: #5E665E;             /* secondary text 5.3:1 */
  --ink-faint: #9AA29A;             /* placeholders, disabled (not for reading) */
  --accent: var(--forest);          /* working colour: links, selected, text accents 4.8:1 */
  --accent-strong: var(--emerald);  /* fills, rings, progress; never text on light */
  --on-accent: var(--offwhite);     /* text on forest 4.8:1 */
  --on-accent-strong: #062611;      /* text on emerald 5.3:1 */
  --coach: var(--burgundy);         /* Adam's voice, alerts, warnings 9.2:1 */
  --on-coach: var(--offwhite);
  --warn: #8A5A00;                  /* pending sync, amber on light 5.6:1 */
  --focus: var(--emerald);

  /* Type: Montserrat, one family, weight does the work */
  --font: "Montserrat", Arial, Helvetica, sans-serif;
  --fs-12: 12px;  /* meta */
  --fs-14: 14px;  /* labels, secondary */
  --fs-16: 16px;  /* body, inputs */
  --fs-20: 20px;  /* card titles */
  --fs-24: 24px;  /* screen titles */
  --fs-32: 32px;  /* key numbers */
  --fs-44: 44px;  /* hero numbers */
  --fs-64: 64px;  /* the one big number */
  --lh-tight: 1.1;
  --lh-body: 1.45;
  --w-regular: 500;
  --w-bold: 700;
  --w-black: 800;
  --track-tight: -0.02em;

  /* 8pt spacing */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --gutter: 16px;                   /* side gutter at 375px */
  --tap: 48px;                      /* minimum hit target */

  /* Radius: hierarchy, not one value everywhere */
  --r-chip: 6px;                    /* chips, small inputs */
  --r-card: 12px;                   /* cards, number fields */
  --r-sheet: 20px;                  /* bottom sheets, top corners */
  --r-pill: 999px;                  /* buttons, toggles */

  /* Elevation: light uses one hairline and one sheet shadow; nothing else floats */
  --elev-0: none;
  --elev-1: 0 0 0 1px var(--line);
  --elev-2: 0 8px 24px rgba(34, 34, 34, 0.12);   /* bottom sheets and the dock only */

  /* Depth and light: one gradient (emerald to forest, never purple) for the rings, one glow for the ring and the primary action.
     The gradient never sits under text: dark ink on the forest end is 3.0:1. */
  --accent-grad: linear-gradient(135deg, #2BA84A 0%, #1F7A36 100%);
  --glow: 0 0 28px rgba(43, 168, 74, 0.45);
  --glow-soft: 0 0 60px rgba(43, 168, 74, 0.18);

  /* Motion: one easing family, four durations */
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --t-micro: 160ms;                 /* taps, ticks, toggles, chips */
  --t-screen: 300ms;                /* screen and sheet transitions */
  --t-draw: 600ms;                  /* chart draw-in, ring fill */
  --t-hero: 1100ms;                 /* the ring and number on Today, the success moment */
}

/* Dark theme: charcoal is the canvas, emerald becomes readable text, burgundy needs a tint */
:root[data-theme="dark"], [data-theme="dark"] {
  --canvas: #1A1C1A;
  --surface: var(--charcoal);       /* 14.6:1 with off-white */
  --surface-2: #282B28;            /* kept dark enough for emerald text 4.7:1 */
  --line: #3A3E3A;
  --ink: var(--offwhite);
  --ink-muted: #A9B0A9;             /* 7.4:1 */
  --ink-faint: #6E756E;
  --accent: var(--emerald);         /* 5.3:1 on charcoal, usable as text */
  --accent-strong: var(--emerald);
  --on-accent: #062611;
  --on-accent-strong: #062611;
  --coach: #E8A9B1;                 /* burgundy tint 8.9:1; raw #6B2D34 fails on dark */
  --on-coach: var(--charcoal);
  --warn: #E8C15A;                  /* 9.3:1 */
  --elev-1: 0 0 0 1px var(--line);
  --elev-2: 0 -1px 0 var(--line);   /* no shadows in the dark: tone does the lifting */
}

@media (prefers-reduced-motion: reduce) {
  :root { --t-micro: 0ms; --t-screen: 0ms; --t-draw: 0ms; --t-hero: 0ms; }
}
/* tokens:end */

/* ---------- base ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--canvas); color: var(--ink); }
/* App-style scrolling: the page never scrolls; body is a full-screen panel that does. The phone's browser bar never
   slides in and out (that caused a flash on scroll-up), no rubber-band past the ends, scroll bars hidden. */
html { height: 100%; overflow: hidden; }
body { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: none; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
#app { overflow-x: hidden; overflow-wrap: anywhere; }
* { scrollbar-width: none; }
*::-webkit-scrollbar { display: none; width: 0; height: 0; }
body { font: var(--w-regular) var(--fs-16)/var(--lh-body) var(--font); font-variant-numeric: tabular-nums; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
::selection { background: var(--accent-strong); color: var(--on-accent-strong); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-chip); }
a { color: inherit; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { max-width: 520px; margin: 0 auto; padding: 0 var(--gutter); }
#app { padding-top: var(--s-3); padding-bottom: calc(110px + env(safe-area-inset-bottom)); min-height: 100vh; }
#app.in-session { padding-bottom: calc(180px + env(safe-area-inset-bottom)); }

/* ---------- motion: one easing, three durations, every tap answers ---------- */
.screen { animation: screen-in var(--t-screen) var(--ease) both; }
.screen.sub { animation-name: sheet-in; }
@keyframes screen-in { from { opacity: 0; transform: translateX(22px); } }
@keyframes sheet-in { from { opacity: 0; transform: translateY(28px) scale(.985); } }
@keyframes pop { from { transform: scale(.6); opacity: .4; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
@keyframes halo { from { r: 5; opacity: .7; } to { r: 18; opacity: 0; } }
@keyframes glowpulse { 0%, 100% { filter: drop-shadow(0 0 10px rgba(43, 168, 74, .35)); } 50% { filter: drop-shadow(0 0 26px rgba(43, 168, 74, .65)); } }
/* ambient light: a soft emerald wash behind the Today hero, nowhere else */
#app.today-bg { background: radial-gradient(70% 36% at 50% -4%, rgba(43, 168, 74, .16), transparent 72%); }
button, .press { transition: transform var(--t-micro) var(--ease), background-color var(--t-micro) var(--ease), color var(--t-micro) var(--ease), box-shadow var(--t-micro) var(--ease); }
button:active, .press:active { transform: scale(.97); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition: none !important; } }

/* ---------- type ---------- */
h1.t { font-size: var(--fs-24); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: var(--lh-tight); margin: 0; }
h1.t.l { font-size: var(--fs-32); }
.meta { font-size: var(--fs-14); color: var(--ink-muted); margin: 0; }
.meta b { color: var(--ink); font-weight: var(--w-bold); }
.sec { font-size: var(--fs-14); font-weight: var(--w-bold); margin: var(--s-5) 0 var(--s-2); }
.big { font-size: var(--fs-44); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: 1; }
.big small, .n small { font-size: var(--fs-14); font-weight: var(--w-regular); color: var(--ink-muted); letter-spacing: 0; margin-left: 4px; }
.on { color: var(--accent); }
.warn-text { color: var(--warn); }
.coach-text { color: var(--coach); }

/* ---------- top of a sub screen ---------- */
.top { display: flex; align-items: center; gap: var(--s-3); min-height: var(--tap); margin-bottom: var(--s-3); }
.top .back { width: var(--tap); height: var(--tap); display: grid; place-items: center; border-radius: var(--r-pill); background: var(--surface); margin-left: -8px; }
.top .back:active { background: var(--surface-2); }
.top .title { flex: 1; min-width: 0; }
.top .title b { display: block; font-size: var(--fs-20); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: var(--lh-tight); }
.top .title span { font-size: var(--fs-14); color: var(--ink-muted); }
.top .pill { font-size: var(--fs-12); font-weight: var(--w-bold); padding: 6px 12px; border-radius: var(--r-pill); background: var(--surface); color: var(--ink-muted); white-space: nowrap; }
.top .pill.go { background: var(--accent); color: var(--on-accent); }

/* ---------- buttons ---------- */
.btn { display: flex; align-items: center; justify-content: center; gap: var(--s-2); height: 52px; border-radius: var(--r-pill); font-weight: var(--w-bold); font-size: var(--fs-16); width: 100%; background: var(--surface-2); color: var(--ink); position: relative; overflow: hidden; }
.btn.strong { background: var(--accent-strong); color: var(--on-accent-strong); box-shadow: var(--glow-soft); }
.btn.strong:active { box-shadow: var(--glow); }
.btn.quiet { background: var(--surface); color: var(--ink-muted); }
.btn.coach { background: var(--coach); color: var(--on-coach); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn.auto { width: auto; padding: 0 20px; height: 44px; }
/* save button states: idle, saving (bar sweeps), saved (tick draws), failed (shake). One element morphs, nothing jumps. */
.btn .st { display: none; align-items: center; gap: 8px; }
.btn[data-state="idle"] .st-idle, .btn[data-state="saving"] .st-saving, .btn[data-state="saved"] .st-saved, .btn[data-state="failed"] .st-failed { display: inline-flex; }
.btn[data-state="saving"]::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 40%; background: var(--on-accent-strong); opacity: .5; animation: sweep 900ms var(--ease) infinite; }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
.btn[data-state="saved"] { background: var(--accent); color: var(--on-accent); }
.btn[data-state="failed"] { background: var(--coach); color: var(--on-coach); animation: shake var(--t-screen) var(--ease); }
@keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
.tickdraw { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw var(--t-draw) var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* ---------- surfaces, rows, lists ---------- */
.card { background: var(--surface); border-radius: var(--r-card); padding: var(--s-4); }
.list { background: var(--surface); border-radius: var(--r-card); overflow: hidden; }
.row { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); min-height: 52px; padding: var(--s-2) var(--s-4); width: 100%; text-align: left; }
.row + .row { border-top: 1px solid var(--line); }
.row .l { font-weight: var(--w-bold); flex: 1; min-width: 0; }
.row .l span { display: block; font-weight: var(--w-regular); color: var(--ink-muted); font-size: var(--fs-14); }
.row .v { font-weight: var(--w-bold); text-align: right; white-space: nowrap; font-size: var(--fs-20); letter-spacing: var(--track-tight); }
.row .v.on { color: var(--accent); }
.row .v small { font-weight: var(--w-regular); color: var(--ink-muted); font-size: var(--fs-14); margin-left: 4px; letter-spacing: 0; }
.row .v.empty { color: var(--ink-muted); font-weight: var(--w-regular); font-size: var(--fs-16); }
button.row:active { background: var(--surface-2); transform: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; }
.two .row:nth-child(odd) { border-right: 1px solid var(--line); }
.two .row:nth-child(-n+2) { border-top: 0; }
.two .row { display: block; min-height: 0; padding: var(--s-3) var(--s-4); }
.two .row b { display: block; font-size: var(--fs-12); color: var(--ink-muted); font-weight: var(--w-bold); }
.two .row .n { font-size: var(--fs-24); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: 1.2; }
.two .row .n.empty { color: var(--ink-muted); font-weight: var(--w-regular); font-size: var(--fs-16); }
.two .row.wide { grid-column: 1 / -1; border-right: 0; }
.tick { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-strong); color: var(--on-accent-strong); display: inline-grid; place-items: center; flex: none; transition: background-color var(--t-micro) var(--ease), box-shadow var(--t-micro) var(--ease); }
.tick svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.tick.off { background: transparent; box-shadow: inset 0 0 0 2px var(--line); }
.tick.off svg { opacity: 0; }
.tick:not(.off) svg { stroke-dasharray: 24; animation: draw var(--t-micro) var(--ease) forwards; }
.tick.pop { animation: pop var(--t-screen) var(--ease); }
.linkrow { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); min-height: var(--tap); font-weight: var(--w-bold); width: 100%; text-align: left; text-decoration: none; }
.linkrow + .linkrow { border-top: 1px solid var(--line); }
.linkrow span { color: var(--ink-muted); font-weight: var(--w-regular); font-size: var(--fs-14); text-align: right; }
.linkrow svg { color: var(--ink-muted); }

/* ---------- hero ring ---------- */
.hero { display: flex; align-items: center; gap: var(--s-4); margin-top: var(--s-4); }
.ring { width: 112px; height: 112px; flex: none; }
.ring circle { fill: none; stroke-width: 10; }
.ring .track { stroke: var(--surface-2); }
.ring .bar { stroke: url(#ringGrad); stroke-linecap: round; transition: stroke-dashoffset var(--t-draw) var(--ease); }
.ring.big { width: 140px; height: 140px; }
.ring.hero { width: 156px; height: 156px; filter: drop-shadow(var(--glow)); animation: glowpulse 3.2s var(--ease) infinite; }
.ring.hero .bar { transition-duration: var(--t-hero); stroke-width: 11; }
.ring.hero .track { stroke: var(--surface-2); }
.hero .n { font-size: var(--fs-44); }
.hero .n { font-size: var(--fs-32); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: 1; }
.hero .n .of { font-size: var(--fs-16); font-weight: var(--w-regular); color: var(--ink-muted); letter-spacing: 0; }
/* ---------- The Contract on Today: the sheet's points string, a pass notch, six weeks, what is still on the table ---------- */
.logo { float: right; width: 40px; height: 40px; margin: var(--s-1) 0 0 var(--s-3); opacity: .9; }
.ct-head { margin-top: var(--s-4); }
.sechead .ct-pill, .ct-pill { display: inline-block; padding: var(--s-1) var(--s-2); border-radius: var(--r-pill); font-size: var(--fs-12); font-weight: var(--w-bold); line-height: var(--lh-tight); white-space: nowrap; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.ct-hero { display: grid; place-items: center; margin-top: var(--s-4); }
.ct-hero > * { grid-area: 1 / 1; }
.ring.ct-notched { overflow: visible; }
.ct-notch { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.ct-in { display: grid; justify-items: center; text-align: center; }
.ct-num { font-size: var(--fs-44); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: 1; color: var(--accent); }
.ct-in small { font-size: var(--fs-14); color: var(--ink-muted); }
.ct-in .ct-pill { margin-top: var(--s-1); }
.ct-ns { font-size: var(--fs-16); color: var(--ink-muted); }
.ct-calm .track, .ct-notset .track { stroke: var(--line); stroke-dasharray: 3 4; }
.ct-calm .bar, .ct-notset .bar, .ct-pending .bar, .ct-future .bar { display: none; }
.ring.hero.ct-calm { filter: none; animation: none; } /* no glow on an empty ring */
.ct-verdict { margin: var(--s-4) 0 var(--s-2); font-size: var(--fs-32); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: var(--lh-tight); text-align: center; text-wrap: balance; animation: rise var(--t-draw) var(--ease) var(--t-draw) both; }
.ct-verdict.ct-long { font-size: var(--fs-24); }
.ct-verdict small { display: block; margin-top: var(--s-1); font-size: var(--fs-14); font-weight: var(--w-regular); letter-spacing: 0; color: var(--ink-muted); }
.ct-hero-tap { display: block; width: 100%; }
.ct-line.ct-plain { grid-template-columns: 1fr auto auto; }
.ct-line.ct-plain .ct-lv { font-size: var(--fs-16); font-weight: var(--w-regular); color: var(--ink-muted); }
.ct-line.ct-plain .ct-lv b { font-size: var(--fs-20); }
.moment.ct-how .sub { max-width: 32ch; line-height: var(--lh-body); }
.ct-verdict.ct-quiet { color: var(--ink-muted); }
.ct-fact { margin: 0; text-align: center; font-size: var(--fs-14); color: var(--ink-muted); animation: rise var(--t-draw) var(--ease) calc(var(--t-draw) + var(--t-micro)) both; }
.ct-fact + .ct-fact { margin-top: var(--s-1); }
.ct-chip { display: inline-block; margin-top: var(--s-2); padding: var(--s-1) var(--s-3); border-radius: var(--r-pill); font-size: var(--fs-12); font-weight: var(--w-bold); background: var(--surface-2); color: var(--ink-muted); }
.ct-chip.ct-pass { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
.ct-chip.ct-miss { background: color-mix(in srgb, var(--coach) 18%, transparent); color: var(--coach); }
.ct-ledger { display: flex; gap: var(--s-1); margin: var(--s-5) calc(-1 * var(--gutter)) 0; padding: 0 var(--gutter); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; } /* every week, newest on the right, scrolled to the end */
.ct-ledger::-webkit-scrollbar { display: none; }
.ct-tile { display: grid; justify-items: center; align-content: start; gap: var(--s-1); flex: 0 0 calc(var(--tap) + var(--s-2)); scroll-snap-align: end; min-width: 0; min-height: var(--tap); padding: var(--s-1) 0; border-radius: var(--r-chip); font-size: var(--fs-12); font-weight: var(--w-bold); color: var(--ink-muted); animation: rise var(--t-screen) var(--ease) both; animation-delay: calc(var(--t-draw) + var(--i) * var(--t-micro) / 2); }
.ct-tile:active { background: var(--surface); }
.ct-ring { display: grid; place-items: center; }
.ct-ring > * { grid-area: 1 / 1; }
.ct-tile .ring { width: calc(var(--tap) + var(--s-1)); height: calc(var(--tap) + var(--s-1)); }
.ct-tile .ct-notch { stroke-width: 6; }
.ct-tn { font-size: var(--fs-14); font-weight: var(--w-bold); color: var(--ink); line-height: 1; }
.ct-notset .ct-tn { width: min-content; overflow-wrap: normal; font-size: var(--fs-12); font-weight: var(--w-regular); color: var(--ink-muted); line-height: var(--lh-tight); text-align: center; }
.ct-passed .ct-tn { color: var(--accent); }
.ct-missed .bar { stroke: var(--coach); }
.ct-missed .ct-tn { color: var(--coach); }
.ct-live .ring { filter: drop-shadow(var(--glow)); animation: glowpulse calc(var(--t-hero) * 3) var(--ease) infinite; }
.ct-live b { color: var(--accent); }
.ct-future { opacity: .4; }
.ct-tile.ct-out { animation: ct-out calc(var(--t-draw) / 2) var(--ease) forwards; }
.ct-tile.ct-flipin { animation: ct-in calc(var(--t-draw) / 2) var(--ease) both; }
@keyframes ct-out { to { transform: rotateY(90deg); } }
@keyframes ct-in { from { transform: rotateY(-90deg); } }
.ct-foot { margin: var(--s-2) 0 0; text-align: center; font-size: var(--fs-12); color: var(--ink-muted); }
.ct-lines { background: var(--surface); border-radius: var(--r-card); overflow: hidden; }
.ct-line { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: var(--s-2) var(--s-3); width: 100%; min-height: var(--tap); padding: var(--s-3) var(--s-4); text-align: left; animation: rise var(--t-screen) var(--ease) both; animation-delay: calc(var(--t-hero) + var(--i) * var(--t-micro) / 2); }
.ct-line + .ct-line { border-top: 1px solid var(--line); }
.ct-line:active { background: var(--surface-2); transform: none; }
.ct-lt { min-width: 0; }
.ct-lt b { display: block; font-size: var(--fs-16); font-weight: var(--w-bold); }
.ct-lt span { display: block; font-size: var(--fs-14); color: var(--ink-muted); }
.ct-lv { text-align: right; white-space: nowrap; font-size: var(--fs-20); font-weight: var(--w-bold); letter-spacing: var(--track-tight); line-height: var(--lh-tight); }
.ct-lv b, .ct-lv i { color: var(--accent); }
.ct-lv i { display: block; font-style: normal; font-size: var(--fs-12); letter-spacing: 0; margin-top: var(--s-1); }
.ct-off .ct-lv b, .ct-off .ct-lv i { color: var(--coach); }
.ct-line > svg.i { color: var(--ink-muted); }
.ct-bar { grid-column: 1 / -1; height: 3px; border-radius: var(--r-pill); background: var(--surface-2); overflow: hidden; }
.ct-bar i { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--accent); transition: width var(--t-draw) var(--ease); }
.ct-off .ct-bar i { background: var(--coach); }
/* a re-render of Today (tap, save, plan) is a still: no slide, no cascade, rings and bars land at their value */
.screen.ct-again, .ct-again .ct-verdict, .ct-again .ct-fact, .ct-again .ct-tile:not(.ct-flipin):not(.ct-out), .ct-again .ct-line { animation: none; }
.ct-again .ct-bar i, .ct-again .ring .bar { transition: none; }
/* settlement: the app's moment with a week tag; a miss is coach-tinted and has no glow (the glow token is emerald) */
.ct-tag { font-size: var(--fs-12); font-weight: var(--w-bold); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); }
.moment.ct-settle .line { font-size: var(--fs-24); font-weight: var(--w-black); letter-spacing: var(--track-tight); }
.moment.miss .ring.hero { filter: none; animation: none; }
.moment.ct-settle { background: var(--canvas); } /* the settlement is a full stop: nothing shows through */
.moment.miss .ring .bar { stroke: var(--coach); }
.moment.miss .huge { color: var(--coach); }

/* ---------- week strip ---------- */
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: var(--s-3); }
.strip button { display: grid; justify-items: center; gap: 6px; font-size: var(--fs-12); font-weight: var(--w-bold); color: var(--ink-muted); padding: 4px 0; border-radius: var(--r-chip); }
.strip button span { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 2px var(--line); color: var(--ink); font-size: var(--fs-12); transition: box-shadow var(--t-micro) var(--ease), background-color var(--t-micro) var(--ease); }
.strip button span.done { background: var(--accent-strong); color: var(--on-accent-strong); box-shadow: none; }
.strip button span.today { box-shadow: inset 0 0 0 2px var(--accent); }
.strip button span.sel { box-shadow: 0 0 0 3px var(--focus); }
.strip button:disabled { opacity: .35; cursor: default; }
.strip button:disabled span { box-shadow: inset 0 0 0 2px var(--line); }
.earlier { margin-top: var(--s-2); display: flex; align-items: center; justify-content: space-between; font-size: var(--fs-14); color: var(--ink-muted); }
.earlier input { height: var(--tap); padding: 0 10px; border-radius: var(--r-chip); background: var(--surface); border: 0; color: var(--ink); color-scheme: dark; font-size: var(--fs-16); }

/* ---------- fields ---------- */
.form { display: grid; gap: var(--s-4); margin-top: var(--s-4); }
.field > span { display: block; font-size: var(--fs-14); font-weight: var(--w-bold); margin-bottom: var(--s-1); }
.field .box { position: relative; }
.field input, .field textarea { width: 100%; height: 56px; padding: 0 60px 0 var(--s-4); font-size: var(--fs-24); font-weight: var(--w-bold); border-radius: var(--r-card); border: 0; background: var(--surface); color: var(--ink); caret-color: var(--accent); box-shadow: var(--elev-1); transition: box-shadow var(--t-micro) var(--ease); }
.field input::placeholder, .field textarea::placeholder { color: var(--ink-muted); font-weight: var(--w-regular); font-size: var(--fs-16); }
.field input:focus, .field textarea:focus { outline: none; box-shadow: 0 0 0 2px var(--focus); }
.field textarea { height: 120px; padding: var(--s-3) var(--s-4); font-size: var(--fs-16); font-weight: var(--w-regular); line-height: var(--lh-body); resize: none; }
.field .unit { position: absolute; right: var(--s-4); top: 50%; transform: translateY(-50%); color: var(--ink-muted); font-size: var(--fs-14); pointer-events: none; }
.field small { display: block; margin-top: var(--s-1); font-size: var(--fs-12); color: var(--ink-muted); }
.field small.warn { color: var(--warn); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale.ten { grid-template-columns: repeat(10, 1fr); gap: 4px; }
.scale button { height: var(--tap); border-radius: var(--r-chip); display: grid; place-items: center; background: var(--surface); box-shadow: var(--elev-1); font-weight: var(--w-bold); font-size: var(--fs-16); }
.scale.ten button { font-size: var(--fs-14); }
.scale button.sel { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.scale-ends { display: flex; justify-content: space-between; font-size: var(--fs-12); color: var(--ink-muted); margin-top: 4px; }
.hab { display: flex; align-items: center; gap: var(--s-3); min-height: var(--tap); width: 100%; text-align: left; padding: 0 var(--s-4); }
.hab + .hab { border-top: 1px solid var(--line); }
.hab span { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { min-height: 40px; padding: 8px 14px; border-radius: var(--r-pill); display: grid; place-items: center; font-size: var(--fs-14); font-weight: var(--w-bold); background: var(--surface); box-shadow: var(--elev-1); text-align: center; }
.chips button.sel { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.yn button { height: 44px; border-radius: var(--r-chip); display: grid; place-items: center; font-weight: var(--w-bold); background: var(--surface); box-shadow: var(--elev-1); }
.yn button.sel { background: var(--accent); color: var(--on-accent); box-shadow: none; }
.sw { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); padding: 0 var(--s-4); min-height: 52px; text-align: left; }
.sw .knob { flex: none; width: 52px; height: 30px; border-radius: var(--r-pill); background: var(--surface-2); position: relative; transition: background-color var(--t-micro) var(--ease); }
.sw .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--ink-muted); transition: transform var(--t-micro) var(--ease), background-color var(--t-micro) var(--ease); }
.sw.on .knob { background: var(--accent-strong); }
.sw.on .knob::after { transform: translateX(22px); background: var(--on-accent-strong); }
.q { margin: 0 0 var(--s-4); }
.q p { margin: 0 0 var(--s-2); font-weight: var(--w-bold); font-size: var(--fs-14); }
.q p small { display: block; font-weight: var(--w-regular); color: var(--ink-muted); font-size: var(--fs-12); }
.coach { display: flex; gap: var(--s-3); align-items: flex-start; padding: var(--s-3) var(--s-4); border-radius: var(--r-card); background: var(--coach); color: var(--on-coach); font-size: var(--fs-14); margin-top: var(--s-3); }
.coach b { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--on-coach); color: var(--coach); display: grid; place-items: center; font-weight: var(--w-black); font-size: 12px; }
.note { padding: var(--s-3) var(--s-4); border-radius: var(--r-card); background: var(--surface); color: var(--ink-muted); font-size: var(--fs-14); margin-top: var(--s-3); }
.note.warn { color: var(--warn); }
.note a { color: var(--ink); font-weight: var(--w-bold); }

/* ---------- log sections: one card per group, its own colour on the rule and icon ---------- */
.fs { --sec: var(--accent-strong); background: var(--surface); border-radius: var(--r-card); box-shadow: var(--elev-1); padding: var(--s-4); position: relative; overflow: hidden; }
.fs::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--sec); }
.fs .fsh { display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-4); }
.fs .fsh i { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--sec) 18%, transparent); color: var(--sec); }
.fs .fsh i svg { width: 20px; height: 20px; }
.fs .fsh b { display: block; font-size: var(--fs-20); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: var(--lh-tight); }
.fs .fsh span { display: block; font-size: var(--fs-12); color: var(--ink-muted); margin-top: 2px; }
.fs .fsh .done { margin-left: auto; flex: none; font-size: var(--fs-12); font-weight: var(--w-bold); color: var(--on-sec, var(--on-accent-strong)); background: var(--sec); padding: 4px 10px; border-radius: var(--r-pill); }
.fs .field input, .fs .field textarea { background: var(--canvas); box-shadow: none; }
.fs .field input:focus, .fs .field textarea:focus { box-shadow: 0 0 0 2px var(--sec); }
.fs .scale button { background: var(--canvas); box-shadow: none; }
.fs .scale button.sel { background: var(--sec); color: var(--on-sec, var(--on-accent-strong)); }
.fs .sw { background: var(--canvas); border-radius: var(--r-card); }
.fs .form { margin-top: 0; }
.fs + .fs { margin-top: var(--s-4); }
.habits { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--elev-1); padding: var(--s-2) 0; }
.habits .hab { padding: 0 var(--s-4); }
.habits .hab span { font-weight: var(--w-bold); }
.habits .hab .tick:not(.off) + span { color: var(--ink-muted); font-weight: var(--w-regular); text-decoration: line-through; text-decoration-color: var(--line); }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); margin: var(--s-5) 0 var(--s-2); }
.sechead b { font-size: var(--fs-20); font-weight: var(--w-black); letter-spacing: var(--track-tight); }
.sechead span { font-size: var(--fs-14); color: var(--ink-muted); }
.sechead span.on { color: var(--accent); font-weight: var(--w-bold); }

/* ---------- sync line ---------- */
.sync { display: flex; align-items: center; gap: 8px; font-size: var(--fs-12); color: var(--ink-muted); margin-top: var(--s-3); min-height: 20px; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-strong); flex: none; }
.sync.pending { color: var(--warn); } .sync.pending::before { background: var(--warn); }
.sync.error { color: var(--warn); } .sync.error::before { background: var(--warn); }

/* ---------- chart ---------- */
.chart { width: 100%; height: auto; display: block; margin-top: var(--s-3); }
.chart .axis { stroke: var(--line); stroke-width: 1; }
.chart .goal { stroke: var(--coach); stroke-width: 1; stroke-dasharray: 3 4; }
.chart .line { stroke: var(--accent-strong); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--t-draw) var(--ease) forwards; }
.chart .trend { stroke: var(--ink-muted); stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
.chart .dot { fill: var(--accent-strong); }
.chart .area { fill: url(#areaGrad); opacity: 0; animation: fadein var(--t-draw) var(--ease) var(--t-draw) forwards; }
@keyframes fadein { to { opacity: 1; } }
.chart .line { filter: drop-shadow(0 0 7px rgba(43, 168, 74, .55)); }
.chart .halo { fill: none; stroke: var(--accent-strong); stroke-width: 2; animation: halo 1.8s var(--ease) infinite; }
.chart text { font-family: var(--font); font-size: 11px; fill: var(--ink-muted); font-weight: var(--w-bold); }

/* ---------- workout: sessions, set table, overview, done ---------- */
.session { margin-top: var(--s-4); background: var(--surface); border-radius: var(--r-card); padding: var(--s-4); display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
.session .meta { margin-top: 2px; }
.days { list-style: none; margin: var(--s-3) 0 0; padding: 0; display: grid; gap: var(--s-2); }
.day { width: 100%; text-align: left; display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4); border-radius: var(--r-card); background: var(--surface); }
.day .num { font-size: var(--fs-12); font-weight: var(--w-bold); color: var(--accent); width: 24px; }
.day b { font-size: var(--fs-20); display: block; letter-spacing: var(--track-tight); }
.day span { font-size: var(--fs-14); color: var(--ink-muted); }
.day .grow { flex: 1; min-width: 0; }
.ex h1 { font-size: var(--fs-32); line-height: var(--lh-tight); margin: 0; letter-spacing: var(--track-tight); font-weight: var(--w-black); text-wrap: balance; }
.target { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: var(--s-3) 0 0; padding: 0; list-style: none; }
.target li { font-size: var(--fs-14); color: var(--ink-muted); }
.target b { color: var(--ink); font-size: var(--fs-20); margin-right: 4px; }
.video { margin-top: var(--s-3); display: inline-flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: var(--r-pill); background: var(--surface); text-decoration: none; font-weight: var(--w-bold); font-size: var(--fs-14); }
.video svg { color: var(--accent); }
.sets { margin-top: var(--s-4); background: var(--surface); border-radius: var(--r-card); overflow: hidden; }
.sets .hd, .set { display: grid; grid-template-columns: 32px 1fr 84px 84px; align-items: center; gap: 8px; padding: 8px var(--s-3); }
.sets .hd { font-size: var(--fs-12); font-weight: var(--w-bold); color: var(--ink-muted); padding-top: var(--s-3); }
.set { border-top: 1px solid var(--line); }
.set .no { font-weight: var(--w-bold); color: var(--ink-muted); }
.set.beaten .no { color: var(--accent); }
.set.beaten { box-shadow: inset 3px 0 0 var(--accent-strong); }
.set.flash { animation: setflash var(--t-draw) var(--ease); }
@keyframes setflash { 0% { background: rgba(43, 168, 74, .25); } 100% { background: transparent; } }
.set .last { font-size: var(--fs-14); line-height: 1.2; text-align: left; width: 100%; padding: 6px 0; border-radius: var(--r-chip); }
.set .last small { display: block; font-size: var(--fs-12); color: var(--ink-muted); }
.set .last.none { color: var(--ink-muted); }
.set .last:not(.none):active { background: var(--surface-2); }
.set input { width: 100%; height: 48px; padding: 0 4px; text-align: center; font-size: var(--fs-20); font-weight: var(--w-bold); border-radius: var(--r-chip); border: 0; background: var(--canvas); color: var(--ink); caret-color: var(--accent); }
.set input::placeholder { color: var(--ink-muted); font-weight: var(--w-regular); font-size: var(--fs-14); }
.set input:focus { outline: none; box-shadow: 0 0 0 2px var(--focus); }
.comment { margin-top: var(--s-3); }
.comment input { width: 100%; height: 48px; padding: 0 var(--s-4); border-radius: var(--r-card); border: 0; background: var(--surface); color: var(--ink); }
.comment input::placeholder { color: var(--ink-muted); }
.hint { color: var(--warn); font-size: var(--fs-14); margin: var(--s-3) 0 0; }
.actbar { position: fixed; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 6; padding: var(--s-3) 0; background: linear-gradient(to top, var(--canvas) 70%, transparent); }
.actbar .wrap { display: flex; gap: var(--s-2); }
.actbar .btn.quiet { width: auto; padding: 0 20px; }
.ov ol { list-style: none; margin: var(--s-3) 0 0; padding: 0; display: grid; gap: var(--s-2); }
.ov .item { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3) var(--s-3) var(--s-3) var(--s-4); border-radius: var(--r-card); background: var(--surface); }
.ov .item .info { flex: 1; min-width: 0; }
.ov .item b { display: block; }
.ov .item span { font-size: var(--fs-14); color: var(--ink-muted); }
.ov .item.is-done { opacity: .6; }
.ov .item.is-skipped b { text-decoration: line-through; color: var(--ink-muted); }
.ov .item.is-current { box-shadow: 0 0 0 2px var(--accent); }
.chip { height: 36px; padding: 0 12px; border-radius: var(--r-pill); font-size: var(--fs-14); font-weight: var(--w-bold); background: var(--surface-2); }
.chip.go { color: var(--accent); }
.chip.skip { color: var(--coach); }
.fin { padding-top: var(--s-5); }
.fin ul { list-style: none; padding: 0; margin: var(--s-4) 0; }
.fin li { display: flex; justify-content: space-between; gap: var(--s-3); padding: var(--s-3) var(--s-4); background: var(--surface); font-size: var(--fs-14); animation: rise var(--t-screen) var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms + 200ms); }
.fin li + li { border-top: 1px solid var(--line); }
.fin li:first-child { border-radius: var(--r-card) var(--r-card) 0 0; } .fin li:last-child { border-radius: 0 0 var(--r-card) var(--r-card); }
.fin li span { color: var(--ink-muted); text-align: right; }
.fin li.up span { color: var(--accent); font-weight: var(--w-bold); }

/* ---------- plan: a hub of three entries, then one screen per thing ---------- */
.entries { display: grid; gap: var(--s-3); margin-top: var(--s-4); }
.entry { display: flex; align-items: center; gap: var(--s-4); width: 100%; text-align: left; padding: var(--s-4); min-height: 88px; border-radius: var(--r-card); background: var(--surface); box-shadow: var(--elev-1); }
.entry .ic { flex: none; width: 52px; height: 52px; border-radius: var(--r-card); display: grid; place-items: center; background: var(--surface-2); color: var(--accent); }
.entry .ic svg { width: 26px; height: 26px; }
.entry .tx { flex: 1; min-width: 0; }
.entry .tx b { display: block; font-size: var(--fs-20); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: var(--lh-tight); }
.entry .tx span { display: block; font-size: var(--fs-14); color: var(--ink-muted); margin-top: 4px; }
.entry > svg.i { color: var(--ink-muted); }
.entry:active { background: var(--surface-2); }
.pcard { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--elev-1); margin-top: var(--s-4); overflow: hidden; }
.pcard .hd { padding: var(--s-4); display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s-3); border-bottom: 1px solid var(--line); }
.pcard .hd b { font-size: var(--fs-20); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: var(--lh-tight); }
.pcard .hd .tag { display: block; font-size: var(--fs-12); font-weight: var(--w-bold); color: var(--accent); margin-bottom: 4px; }
.pcard .hd .kcal { flex: none; max-width: 60%; overflow-wrap: normal; text-align: right; font-size: var(--fs-20); font-weight: var(--w-black); color: var(--accent); letter-spacing: var(--track-tight); }
.pcard .hd .kcal small { display: block; font-size: var(--fs-12); font-weight: var(--w-regular); color: var(--ink-muted); letter-spacing: 0; }
.pcard .food { display: flex; justify-content: space-between; gap: var(--s-3); padding: var(--s-3) var(--s-4); }
.pcard .food + .food { border-top: 1px solid var(--line); }
.pcard .food b { font-weight: var(--w-bold); }
.pcard .food span { color: var(--ink); font-weight: var(--w-bold); max-width: 60%; overflow-wrap: normal; text-align: right; }
.pcard .tot { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface-2); padding: var(--s-3) var(--s-4); }
.pcard .tot div { font-size: var(--fs-12); color: var(--ink-muted); }
.pcard .tot div b { display: block; font-size: var(--fs-16); color: var(--ink); font-weight: var(--w-black); }
.kv { display: grid; grid-template-columns: 72px 1fr; gap: var(--s-2) var(--s-3); padding: var(--s-3) var(--s-4); }
.kv span { font-size: var(--fs-12); font-weight: var(--w-bold); color: var(--ink-muted); padding-top: 3px; }
.kv div { font-size: var(--fs-16); }
.kv div.big { font-size: var(--fs-20); font-weight: var(--w-black); color: var(--accent); letter-spacing: var(--track-tight); }
.kv div.txt { color: var(--ink-muted); font-size: var(--fs-14); white-space: pre-line; }
.planrow { display: flex; align-items: center; gap: var(--s-3); width: 100%; text-align: left; padding: var(--s-4); border-radius: var(--r-card); background: var(--surface); box-shadow: var(--elev-1); }
.planrow .n { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2); color: var(--accent); display: grid; place-items: center; font-weight: var(--w-black); }
.planrow .tx { flex: 1; min-width: 0; }
.planrow .tx b { display: block; font-size: var(--fs-20); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: var(--lh-tight); }

.shop li button { width: 100%; display: flex; justify-content: space-between; gap: var(--s-3); align-items: center; padding: var(--s-3) var(--s-4); border-radius: var(--r-card); background: var(--surface); text-align: left; }
.shop li.got button { opacity: .45; }

.stepper { display: flex; align-items: center; gap: var(--s-2); }

.stepper b { width: 28px; text-align: center; }

/* ---------- photos ---------- */
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: var(--s-3); }
.thumbs figure { margin: 0; position: relative; border-radius: var(--r-card); overflow: hidden; aspect-ratio: 3 / 4; background: var(--surface); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; }
.thumbs figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 6px; font-size: var(--fs-12); background: rgba(34, 34, 34, .8); color: var(--ink); }
.pick { display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: var(--r-pill); background: var(--accent-strong); color: var(--on-accent-strong); font-weight: var(--w-bold); cursor: pointer; margin-top: var(--s-3); }
.pick input { display: none; }

/* ---------- dock ---------- */
.dock { position: fixed; left: 50%; transform: translateX(-50%); width: 100%; max-width: 520px; bottom: 0; z-index: 7; border-radius: var(--r-sheet) var(--r-sheet) 0 0; height: calc(84px + env(safe-area-inset-bottom)); padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom)); display: flex; justify-content: space-around; align-items: flex-start; background: var(--surface); box-shadow: var(--elev-2); }
.dock button { color: var(--ink-muted); font-size: var(--fs-12); font-weight: var(--w-bold); display: grid; justify-items: center; gap: 4px; min-width: var(--tap); padding: 6px 12px; border-radius: var(--r-card); position: relative; }
.dock button.on { color: var(--accent); }
.dock button.on::before { content: ""; position: absolute; inset: 0; border-radius: var(--r-card); background: rgba(43, 168, 74, .12); box-shadow: var(--glow-soft); animation: pop var(--t-screen) var(--ease); }
.dock button svg { position: relative; }
.dock button:active { transform: none; background: var(--surface-2); }

/* success moment: one full-screen beat after a save, a session, a milestone. Tap or wait to dismiss. */
.moment { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; padding: var(--gutter); background: rgba(26, 28, 26, .94); animation: fadein var(--t-screen) var(--ease) both; cursor: pointer; }
.moment.out { animation: fadeout var(--t-screen) var(--ease) forwards; }
@keyframes fadeout { to { opacity: 0; } }
.moment .in { display: grid; justify-items: center; text-align: center; gap: var(--s-3); animation: pop var(--t-draw) var(--ease) both; }
.moment .huge { font-size: var(--fs-64); font-weight: var(--w-black); letter-spacing: var(--track-tight); line-height: 1; color: var(--accent); }
.moment .huge small { display: block; font-size: var(--fs-16); font-weight: var(--w-regular); color: var(--ink-muted); letter-spacing: 0; margin-top: var(--s-2); }
.moment .line { color: var(--ink); font-weight: var(--w-bold); font-size: var(--fs-20); }
.moment .sub { color: var(--ink-muted); font-size: var(--fs-14); }
.moment .ring.hero { width: 200px; height: 200px; }
.moment .tick { width: 56px; height: 56px; }
.moment .tick svg { width: 28px; height: 28px; }
/* loading: a shimmer of the Today layout, not a sentence */
.skel { display: grid; gap: var(--s-4); padding-top: var(--s-4); }
.skel i { display: block; border-radius: var(--r-card); background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
.loading, .err { padding: 80px 0; color: var(--ink-muted); }
.err b { color: var(--ink); display: block; font-size: var(--fs-20); margin-bottom: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--accent); color: var(--on-accent); padding: 10px 16px; border-radius: var(--r-pill); font-weight: var(--w-bold); font-size: var(--fs-14); z-index: 8; animation: screen-in var(--t-screen) var(--ease) both; }
</style>

<script>
// Served two ways: by Apps Script (template tags filled in) or as a plain page on GitHub Pages, where the link
// carries the script (?s=<deployment id>) and key (?k=). Plain page without ?s = mock backend for testing.
var Q = new URLSearchParams(location.search);
var KEY = '<?= key ?>'; if (KEY.charAt(0) === '<') KEY = Q.get('k') || '';
var SCRIPT = /^[\w-]{20,}$/.test(Q.get('s') || '') ? Q.get('s') : '';
var SAVED_TO = document.body.dataset.savedTo.charAt(0) === '<' ? 'Adam\'s sheet' : document.body.dataset.savedTo;
var LS = (function () {
  try { localStorage.setItem('cw:t', '1'); localStorage.removeItem('cw:t'); return localStorage; }
  catch (e) { var m = {}; return { getItem: function (k) { return k in m ? m[k] : null; }, setItem: function (k, v) { m[k] = String(v); }, removeItem: function (k) { delete m[k]; } }; }
})();
var NS = SCRIPT ? SCRIPT.slice(-10) + '|' : '';
function load(k, d) { try { var v = LS.getItem(NS + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function store(k, v) { try { LS.setItem(NS + k, JSON.stringify(v)); } catch (e) {} }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
function $(id) { return document.getElementById(id); }
function icon(n) { return '<svg class="i"><use href="#i-' + n + '"/></svg>'; }
var MESSAGE_ADAM = '<a href="mailto:adam@adamjohnston.uk">Message Adam</a>';

/* ---------- backend: Apps Script in production, JSON API on the hosted page, mock when opened as a plain file ---------- */
function gs(fn) { return function (p) { return new Promise(function (ok, no) { google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](KEY, p); }); }; }
var FNS = { getData: 'getData', save: 'saveExercise', saveCheckIn: 'saveCheckIn', getPlan: 'getPlan', saveTask: 'saveTask', saveMeasurement: 'saveMeasurement',
  uploadPhoto: 'uploadPhoto', getWeeklyForm: 'getWeeklyForm', saveWeeklyCheckIn: 'saveWeeklyCheckIn' };
var api = {};
function timed(fn) { // a call that never settles would pin the queue: give up after 90 s and let the retry timer try again
  return function (p) { return Promise.race([fn(p), new Promise(function (_, no) { setTimeout(function () { no(new Error('No reply from the sheet yet. Will retry.')); }, 90000); })]); };
}
Object.keys(FNS).forEach(function (k) {
  api[k] = (typeof google !== 'undefined' && google.script) ? timed(gs(FNS[k])) : SCRIPT ? timed(function (p) { return post(FNS[k], p); }) : null;
});
if (!api.getData) api = mockApi();
function post(fn, p) { // text/plain body: no CORS preflight, Apps Script answers with JSON {ok, result|error}
  return fetch('https://script.google.com/macros/s/' + SCRIPT + '/exec', { method: 'POST', body: JSON.stringify({ fn: fn, k: KEY, p: p }) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error); return j.result; });
}

/* ---------- state ---------- */
var data = load('cw:data', null);
var queue = load('cw:q', []);
var view = { screen: '', tab: 'today', day: null };
var sess = null;
var syncState = { busy: false, error: '' };
var lastWrite = 0, fetchedOn = '', fetchedAt = 0; // a save that landed after boot's snapshot was taken must win over it
var plan = load('cw:plan', null);

function dayByName(n) { return data.days.filter(function (d) { return d.name === n; })[0]; }
function exByName(day, n) { return day.exercises.filter(function (x) { return x.name === n; })[0]; }
function setCount(x) { var n = parseInt(x.sets, 10); return n >= 1 ? Math.min(n, 4) : 4; }
function hasNums(e) { return !!e && e.kg.concat(e.reps).some(function (v) { return /\d/.test(v); }); }
function prevOf(x) {
  for (var w = data.week - 1; w >= 1; w--) { var e = x.history[w]; if (hasNums(e)) return { week: w, kg: e.kg, reps: e.reps, comment: e.comment }; }
  return null;
}
function sessKey(day) { return 'cw:s:' + data.week + ':' + day; }
function openSession(dayName) {
  var day = dayByName(dayName);
  var s = load(sessKey(dayName), null);
  if (!s) {
    s = { order: day.exercises.map(function (x) { return x.name; }), done: [], skipped: [], drafts: {} };
    day.exercises.forEach(function (x) {
      var cur = x.history[data.week];
      if (hasNums(cur)) { s.done.push(x.name); s.drafts[x.name] = { kg: cur.kg.slice(), reps: cur.reps.slice(), comment: cur.comment }; }
    });
  }
  var names = day.exercises.map(function (x) { return x.name; });
  s.order = s.order.filter(function (n) { return names.indexOf(n) > -1; }).concat(names.filter(function (n) { return s.order.indexOf(n) < 0; }));
  sess = s; sess.day = dayName;
  if (!sess.current || remaining().indexOf(sess.current) < 0) sess.current = remaining()[0] || null;
  saveSess();
}
function saveSess() { store(sessKey(sess.day), sess); }
function remaining() { return sess.order.filter(function (n) { return sess.done.indexOf(n) < 0 && sess.skipped.indexOf(n) < 0; }); }
function draft(name) { return sess.drafts[name] || (sess.drafts[name] = { kg: ['', '', '', ''], reps: ['', '', '', ''], comment: '' }); }
function dayDone(d) { // every exercise logged or skipped, and at least one logged: an all-skipped day is not a session
  var s = load(sessKey(d.name), null);
  var logged = function (x) { return hasNums(x.history[data.week]) || (s && s.done.indexOf(x.name) > -1); };
  return d.exercises.length && d.exercises.some(logged) && d.exercises.every(function (x) { return logged(x) || (s && s.skipped.indexOf(x.name) > -1); });
}

/* ---------- save queue: nothing is lost if the signal drops. Same keys and payloads as before. ---------- */
function qKey(q) {
  if (q.type === 'ci') return 'ci|' + q.date + '|' + q.field;
  if (q.type === 'task') return 'task|' + q.week + '|' + q.idx;
  if (q.type === 'ms') return 'ms|' + q.week;
  if (q.type === 'wc') return 'wc|' + q.week;
  return q.day + '|' + q.exercise + '|' + q.week;
}
function enqueue(p) {
  queue = queue.filter(function (q) { return qKey(q) !== qKey(p); });
  queue.push(p); store('cw:q', queue); flush();
}
function flush() {
  if (syncState.busy || !queue.length) return renderSync();
  syncState.busy = true; renderSync();
  var p = queue[0];
  var call = p.type === 'ci' ? api.saveCheckIn(p) : p.type === 'task' ? api.saveTask(p) : p.type === 'ms' ? api.saveMeasurement(p) : p.type === 'wc' ? api.saveWeeklyCheckIn(p) : api.save(p);
  function fin() { syncState.busy = false; if (queue.length && !syncState.error) flush(); else renderSync(); }
  call.then(function (res) {
    var i = queue.indexOf(p); if (i > -1) queue.splice(i, 1); // by identity: a superseded in-flight item is already gone, never shift the newer one
    store('cw:q', queue); syncState.error = '';
    if (p.type === 'ci') return checkInSaved(p, res || {});
    if (p.type === 'task' || p.type === 'ms') return otherSaved(p, res || {});
    if (p.type === 'wc') return weeklySaved(p, res || {});
    if (res && res.ok === false) { toast(res.error || 'That workout did not save.'); return; } // a permanent refusal is dropped and said, not retried forever
    var x = data && dayByName(p.day) && exByName(dayByName(p.day), p.exercise);
    if (x && !p.skip) { x.history[p.week] = { kg: p.kg, reps: p.reps, comment: p.comment }; store('cw:data', data); }
  }, function (err) {
    syncState.error = (err && err.message) || 'No connection';
    if (p.type === 'ci') setSaveState('failed');
  }).then(fin, function (e) { syncState.error = (e && e.message) || 'Something went wrong showing that save'; fin(); }); // a render error must never pin the queue
}
setInterval(function () { if (queue.length) { syncState.error = ''; flush(); } }, 30000);
window.addEventListener('online', function () { syncState.error = ''; flush(); });
function renderSync() {
  var el = $('sync'); if (!el) return;
  el.className = 'sync' + (syncState.error ? ' error' : queue.length ? ' pending' : '');
  el.textContent = syncState.error && !queue.length ? 'Offline. Showing what you last loaded.'
    : syncState.error ? 'Saved on your phone, will send when you are back online (' + queue.length + ' waiting).'
    : queue.length ? 'Saving to ' + SAVED_TO + '…' : 'Everything saved to ' + SAVED_TO;
}

/* ---------- dates and small helpers ---------- */
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function localIso() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function dateOf(iso) { return new Date(iso + 'T12:00:00'); }
function fmtDate(iso) { return iso ? dateOf(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long' }) : ''; }
function shortDate(iso) { return dateOf(iso).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
function weekday(iso) { return dateOf(iso).toLocaleDateString('en-GB', { weekday: 'long' }); }
function fmtNum(v) { var n = Number(String(v).replace(/,/g, '')); return v === '' || isNaN(n) ? String(v) : n.toLocaleString('en-GB'); }
function num(v) { return Number(String(v == null ? '' : v).replace(/,/g, '')) || 0; }
function addDaysIso(iso, n) { var d = dateOf(iso); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function countUp(el, from, to, suffix, ms) { // numbers that change count, they do not jump (300 ms unless told)
  var t0 = performance.now(), dur = reduced() ? 0 : (ms || 300);
  function step(t) { var k = dur ? Math.max(0, Math.min(1, (t - t0) / dur)) : 1, e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(from + (to - from) * e) + (suffix || ''); if (k < 1) requestAnimationFrame(step); }
  requestAnimationFrame(step);
}
function reduced() { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function buzz(p) { try { if (navigator.vibrate && !reduced()) navigator.vibrate(p); } catch (e) {} }
// One full-screen beat. o = {ring: 0..1, huge, small, line, sub, tick, cls, tag, extra (svg inside the ring), dur (count ms), buzz (fired as the count lands)}.
// Dismissed by a tap or after `hold` ms.
function moment(o, hold) {
  var el = document.createElement('div'); el.className = 'moment' + (o.cls ? ' ' + o.cls : '');
  el.innerHTML = '<div class="in">' + (o.tag ? '<div class="ct-tag">' + esc(o.tag) + '</div>' : '') + (o.tick ? '<i class="tick pop"><svg class="tickdraw" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>' : '') +
    (o.ring !== undefined ? ringSvg(o.ring, 'hero' + (o.extra ? ' ct-notched' : ''), o.extra) : '') +
    (o.huge !== undefined ? '<div class="huge"><span id="momentN">' + esc(o.huge) + '</span>' + (o.small ? '<small>' + esc(o.small) + '</small>' : '') + '</div>' : '') +
    (o.line ? '<div class="line">' + esc(o.line) + '</div>' : '') + (o.sub ? '<div class="sub">' + esc(o.sub) + '</div>' : '') + '</div>';
  document.body.appendChild(el);
  startRings();
  if (typeof o.huge === 'number' && $('momentN')) countUp($('momentN'), o.from || 0, o.huge, '', o.dur);
  if (o.buzz) setTimeout(function () { buzz(o.buzz); }, o.dur || 0);
  var gone = false, close = function () { if (gone) return; gone = true; el.classList.add('out'); setTimeout(function () { el.remove(); }, reduced() ? 0 : 320); if (o.then) o.then(); };
  el.addEventListener('click', close);
  setTimeout(close, reduced() ? 600 : (hold || 1900));
}
var MILESTONES = [7, 14, 30, 60, 100];
function momentUp() { return !!document.querySelector('.moment:not(.out)'); }
function milestoneCheck(st) { // the highest unseen milestone at or below the run, so a day logged by taps alone is not lost
  if (momentUp()) return false; // never stacked: the settlement calls this again when it closes
  var due = MILESTONES.filter(function (m) { return st.n >= m && !load('cw:ms:' + m, false); }), hit = due[due.length - 1]; if (!hit) return false;
  due.forEach(function (m) { store('cw:ms:' + m, true); }); buzz([30, 40, 60]);
  var nxt = MILESTONES.filter(function (m) { return m > hit; })[0];
  moment({ huge: st.n, from: Math.max(0, st.n - 6), small: 'days in a row', line: 'That is a run.', sub: nxt ? 'Next milestone at ' + nxt + ' days.' : 'Nobody beats that.' }, 2600);
  return true;
}
function toast(msg) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2200); }

/* ---------- check in helpers (copies of Logic.js checks: instant feedback, works offline; the server checks again) ---------- */
var WEIGHT_RANGE = { kg: [30, 300], lbs: [66, 661], lb: [66, 661] };
function parseWeight(input, unit) {
  var range = WEIGHT_RANGE[String(unit).toLowerCase()];
  if (!range) return { error: 'Your Check In tab has no kg or lbs unit under Bodyweight. Message Adam.' };

    html += '<div class="coach"><b>AJ</b><span>' + autoN + (autoN === 1 ? ' answer' : ' answers') + ' filled in from your sheet: ' + sessionsDone() + ' of ' + trainingTarget() + ' sessions logged' +
      (mm ? ', measurements ' + (mOk ? 'in' : 'not yet') : '') + ', check in tab ' + (cdn.done ? 'done today' : 'not yet today') + '. Change any of them below.</span></div>';
  }
  html += '<div class="form">';
  quick.forEach(function (q) {
    var v = a[q.id], required = q.required ? '' : '<small>Optional</small>';
    html += '<div class="q"><p>' + esc(q.title) + required + (q.help ? '<small>' + esc(q.help) + '</small>' : '') + '</p>';
    if (q.type === 'SCALE') {
      var lo = typeof q.low === 'number' ? q.low : 1, hi = typeof q.high === 'number' ? q.high : 10, ns = []; for (var n = lo; n <= hi; n++) ns.push(n);
      html += '<div class="scale' + (ns.length > 6 ? ' ten' : '') + '" style="' + (ns.length > 6 && ns.length < 10 ? 'grid-template-columns:repeat(' + ns.length + ',1fr)' : '') + '">' + ns.map(function (n) { return '<button data-wq="' + q.id + '" data-v="' + n + '" class="' + (String(v) === String(n) ? 'sel' : '') + '">' + n + '</button>'; }).join('') + '</div>' +
        (q.lowLabel || q.highLabel ? '<div class="scale-ends"><span>' + esc(q.lowLabel || '') + '</span><span>' + esc(q.highLabel || '') + '</span></div>' : '');
    } else if (q.type === 'CHECKBOX') {
      var arr = Array.isArray(v) ? v : [];
      html += '<div class="chips">' + q.choices.map(function (c) { return '<button data-wq="' + q.id + '" data-v="' + esc(c) + '" data-multi="1" class="' + (arr.indexOf(c) > -1 ? 'sel' : '') + '">' + esc(c) + '</button>'; }).join('') + '</div>';
    } else if (q.choices.length === 2 && q.choices.every(function (c) { return /^(yes|no)\b/i.test(c); })) {
      html += '<div class="yn">' + q.choices.map(function (c) { return '<button data-wq="' + q.id + '" data-v="' + esc(c) + '" class="' + (v === c ? 'sel' : '') + '">' + esc(c) + '</button>'; }).join('') + '</div>';
    } else {
      html += '<div class="chips">' + q.choices.map(function (c) { return '<button data-wq="' + q.id + '" data-v="' + esc(c) + '" class="' + (v === c ? 'sel' : '') + '">' + esc(c) + '</button>'; }).join('') + '</div>';
    }
    html += '</div>';
  });
  if (text.length) {
    var req = text.filter(function (q) { return q.required; }), opt = text.filter(function (q) { return !q.required; });
    var box = function (q) { return '<label class="field"><span>' + esc(q.title) + (q.required ? '' : ' <small style="display:inline;color:var(--ink-muted)">optional</small>') + '</span><textarea data-wt="' + q.id + '" placeholder="' + esc(q.help || 'A line or two') + '">' + esc(a[q.id] || '') + '</textarea></label>'; };
    html += req.map(box).join('');
    if (opt.length) html += '<details' + (d.more ? ' open' : '') + ' id="wmore"><summary class="sec" style="cursor:pointer;list-style:none;margin:0">Say more (' + opt.length + ' optional)</summary><div class="form" style="margin-top:var(--s-3)">' + opt.map(box).join('') + '</div></details>';
  }
  html += '<p class="note" id="wmsg" hidden></p><button class="btn strong" data-act="weekly-send">Send to Adam</button><p class="sync" id="sync"></p></div></section>';
  $('app').innerHTML = html;
  var m = $('wmore'); if (m) m.addEventListener('toggle', function () { var dd = load(wdKey(), { answers: a }); dd.more = m.open; store(wdKey(), dd); });
  store(wdKey(), d);
  renderSync();
}
function weeklyAnswer(id, v, multi) {
  var d = load(wdKey(), { answers: {} }); d.touched = d.touched || {}; d.touched[id] = 1;
  if (multi) { var arr = Array.isArray(d.answers[id]) ? d.answers[id] : []; var i = arr.indexOf(v); if (i > -1) arr.splice(i, 1); else arr.push(v); d.answers[id] = arr; }
  else d.answers[id] = d.answers[id] === v ? '' : v;
  store(wdKey(), d);
  Array.prototype.forEach.call(document.querySelectorAll('[data-wq="' + id + '"]'), function (b) {
    var on = multi ? d.answers[id].indexOf(b.dataset.v) > -1 : d.answers[id] === b.dataset.v; b.classList.toggle('sel', on);
  });
}
function weeklySend() {
  var d = load(wdKey(), { answers: {} }), a = d.answers;
  Array.prototype.forEach.call(document.querySelectorAll('[data-wt]'), function (t) { a[t.dataset.wt] = String(t.value).trim(); });
  wform.items.forEach(function (q) { if (q.type === 'DATE' && !a[q.id]) a[q.id] = localIso(); });
  var missing = wform.items.filter(function (q) { var v = a[q.id]; return q.required && (v === undefined || v === '' || (Array.isArray(v) && !v.length)); });
  var msg = $('wmsg');
  if (missing.length) { msg.hidden = false; msg.className = 'note warn'; msg.textContent = 'Still needs an answer: ' + missing[0].title; return; }
  store(wdKey(), d);
  enqueue({ type: 'wc', week: data.week, answers: a });
  msg.hidden = false; msg.className = 'note'; msg.textContent = 'Sending to Adam…';
}
function weeklySaved(p, res) {
  if (res.ok) { store('cw:wsent:' + p.week, true); buzz(20); moment({ tick: true, line: 'Sent to Adam', sub: 'Week ' + p.week + ' check in is in.' }, 1600); if (view.screen === 'weekly') renderWeekly(); }
  else { var msg = $('wmsg'); if (msg) { msg.hidden = false; msg.className = 'note warn'; msg.textContent = res.error || 'That did not send. Try again.'; } else toast(res.error || 'Check in did not send'); }
}

/* ---------- Measurements ---------- */
var msMsg = '';
function renderMeasure() {
  var m = data.measurements; if (!m) return show('progress');
  var tw = m.thisWeek, lw = m.lastWeek;
  var html = '<section class="screen">' + topBar('Measurements', tw ? 'Week ' + tw.week + (tw.date ? ', ' + tw.date : '') : 'Week ' + data.week, 'progress');
  if (!tw) { $('app').innerHTML = html + '<p class="note warn">Week ' + data.week + ' is not on your Measurements tab yet. ' + MESSAGE_ADAM + '.</p></section>'; return; }
  html += '<p class="meta">Sunday morning, before food, tape snug not tight, same spot each week.</p><div class="form"><div class="grid2">' + m.fields.map(function (x) {
    var last = lw && lw.values[x.id];
    return '<label class="field"><span>' + esc(x.label) + '</span><div class="box"><input data-cm="' + esc(x.id) + '" inputmode="decimal" enterkeyhint="next" autocomplete="off" value="' + esc(tw.values[x.id] || '') + '" placeholder="' + esc(last || '0.0') + '" aria-label="' + esc(x.label) + ' in cm"><span class="unit">cm</span></div>' + (last ? '<small>Last week ' + esc(last) + '</small>' : '') + '</label>';
  }).join('') + '</div>' +
    '<p class="note' + (/did not|wrong|number|not on/i.test(msMsg) ? ' warn' : '') + '" id="msMsg" aria-live="polite"' + (msMsg ? '' : ' hidden') + '>' + esc(msMsg) + '</p>' +
    '<button class="btn strong" data-act="ms-save">Save week ' + tw.week + '</button><p class="sync" id="sync"></p></div></section>';
  $('app').innerHTML = html;
  renderSync();
}
function measureSave() {
  var m = data.measurements, vals = {}, errs = [];
  Array.prototype.forEach.call(document.querySelectorAll('[data-cm]'), function (inp) {
    var v = String(inp.value).trim().replace(/,/g, '.').replace(/\s*cm$/i, ''); if (!v) return;
    if (!/^\d+(\.\d+)?$/.test(v) || +v < 5 || +v > 250) return errs.push(inp.getAttribute('aria-label') + ' looks wrong.');
    v = String(Math.round(+v * 10) / 10);
    if (v !== String(m.thisWeek.values[inp.dataset.cm] || '')) vals[inp.dataset.cm] = v;
  });
  if (errs.length) { msMsg = errs[0]; $('msMsg').hidden = false; $('msMsg').textContent = msMsg; $('msMsg').className = 'note warn'; return; }
  if (!Object.keys(vals).length) { toast('Nothing changed'); return; }
  Object.assign(m.thisWeek.values, vals);
  var q = queue.filter(function (x) { return x.type === 'ms' && x.week === m.thisWeek.week; })[0];
  enqueue({ type: 'ms', week: m.thisWeek.week, values: Object.assign({}, q ? q.values : {}, vals) });
  store('cw:data', data); msMsg = 'Saving…'; renderMeasure();
}

/* ---------- Photos: shrunk on the phone, uploaded one at a time, never shown back ---------- */
var photos = [];
function renderPhotos() {
  if (view.screen !== 'photos') return;
  var done = photos.filter(function (p) { return p.status === 'done'; }).length;
  $('app').innerHTML = '<section class="screen">' + topBar('Progress photos', 'Week ' + data.week, 'progress') +
    '<p class="meta">Front, side and back, same light and spot each week. They go straight into your Week ' + data.week + ' photos folder.' + (done ? ' <b>' + done + ' uploaded.</b>' : '') + '</p>' +
    '<label class="pick">' + icon('plus') + '<span>Add photos</span><input type="file" id="photoIn" accept="image/*" multiple></label>' +
    (photos.length ? '<p class="meta" style="margin-top:var(--s-2)">Keep this screen open until each photo says Uploaded.</p>' : '') +
    '<div class="thumbs">' + photos.map(function (x, i) {
      return '<figure><img src="' + x.url + '" alt="Photo ' + (i + 1) + '"><figcaption>' + (x.status === 'failed' ? '<button class="chip skip" data-retry="' + i + '">Try again</button>' : esc(x.label)) + '</figcaption></figure>';
    }).join('') + '</div></section>';
  $('photoIn').onchange = function () { Array.prototype.forEach.call(this.files, addPhoto); this.value = ''; };
}
function addPhoto(file) {
  var x = { url: URL.createObjectURL(file), status: 'waiting', label: 'Getting ready…', data: '' };
  photos.push(x); renderPhotos();
  shrink(file).then(function (b64) { x.data = b64; x.label = 'Waiting…'; pumpPhotos(); }, function () { x.status = 'bad'; x.label = 'Could not read this one'; renderPhotos(); });
}
function shrink(file) {
  return new Promise(function (ok, no) {
    var img = new Image();
    img.onload = function () {
      var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', 0.8).split(',')[1]);
    };
    img.onerror = no; img.src = URL.createObjectURL(file);
  });
}
var photoBusy = false;
function pumpPhotos() {
  if (photoBusy) return;
  var x = photos.filter(function (p) { return p.status === 'waiting' && p.data; })[0]; if (!x) return;
  photoBusy = true; x.status = 'up'; x.label = 'Uploading…'; if (view.screen === 'photos') renderPhotos();
  api.uploadPhoto({ week: data.week, data: x.data }).then(function (res) {
    if (res && res.ok) { x.status = 'done'; x.label = 'Uploaded'; x.data = ''; } else { x.status = 'failed'; x.label = (res && res.error) || 'Failed'; }
  }, function () { x.status = 'failed'; x.label = 'No signal'; }).then(function () { photoBusy = false; if (view.screen === 'photos') renderPhotos(); pumpPhotos(); });
}
function retryPhoto(i) { var x = photos[i]; if (x && x.data) { x.status = 'waiting'; x.label = 'Waiting…'; pumpPhotos(); renderPhotos(); } }

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) return show(b.dataset.tab);
  if (b.dataset.back) return show(b.dataset.back);
  if (b.dataset.day) { view.tab = 'workout'; openSession(b.dataset.day); return show(sess.current ? 'ex' : 'ov'); }
  if (b.dataset.ctWeek) return ctTileTap(+b.dataset.ctWeek);
  if (b.dataset.ctGo) { if (b.dataset.ctGo === 'points') return ctHow(); if (b.dataset.ctGo !== 'habits') return show(b.dataset.ctGo); var hp = $('habPill'); if (hp) hp.parentNode.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' }); return; }
  if (b.dataset.go) return show(b.dataset.go);
  if (b.dataset.ciDate) { ciState = { date: b.dataset.ciDate, confirm: '', msg: '', warn: false }; return renderLog(); }
  if (b.dataset.scale) return scaleSave(b.dataset.scale, +b.dataset.n);
  if (b.dataset.habit) return switchSave('habit:' + b.dataset.habit, b.dataset.today ? localIso() : undefined);
  if (b.dataset.sw) return switchSave(b.dataset.sw);
  if (b.dataset.task) return taskToggle(+b.dataset.task);
  if (b.dataset.wq) return weeklyAnswer(b.dataset.wq, b.dataset.v, !!b.dataset.multi);
  if (b.dataset.copy !== undefined) return copyLast(+b.dataset.copy);
  if (b.dataset.shop) return shopTick(b.dataset.shop);
  if (b.dataset.plan) return planDays(b.dataset.plan, +b.dataset.step);
  if (b.dataset.retry) return retryPhoto(+b.dataset.retry);
  var act = b.dataset.act, n = b.dataset.n;
  if (act === 'save-log') return saveLog();
  if (act === 'shop-make') return shopMake();
  if (act === 'shop-change') { shopState().made = false; saveShopState(); return renderShop(); }
  if (act === 'ms-save') return measureSave();
  if (act === 'weekly-send') return weeklySend();
  if (act === 'weekly-again') { store('cw:wsent:' + data.week, false); return renderWeekly(); }
  if (act === 'go' || act === 'edit') { sess.current = n; sess.done = sess.done.filter(function (x) { return x !== n; }); saveSess(); return show('ex'); }
  if (act === 'skip') { sess.skipped.push(n); if (sess.current === n) sess.current = remaining()[0] || null; saveSess(); commit(n, true); return show('ov'); }
  if (act === 'unskip') { sess.skipped = sess.skipped.filter(function (x) { return x !== n; }); saveSess(); return show('ov'); }
  if (act === 'finish') return show('fin');
});
function copyLast(i) { // one tap fills a set with last time's numbers
  var p = prevOf(exByName(dayByName(sess.day), sess.current)), d = draft(sess.current); if (!p) return;
  d.kg[i] = p.kg[i] || ''; d.reps[i] = p.reps[i] || ''; saveSess();
  var row = $('set' + i); row.querySelector('[data-f="kg"]').value = d.kg[i]; row.querySelector('[data-f="reps"]').value = d.reps[i];
  row.classList.toggle('beaten', beats(p, i, d.kg[i], d.reps[i]));
}
$('skipBtn').onclick = function () { var n = sess.current; sess.skipped.push(n); saveSess(); commit(n, true); next(); };
$('doneBtn').onclick = function () {
  var n = sess.current, d = draft(n);
  var any = d.kg.concat(d.reps, [d.comment]).some(function (v) { return String(v).trim() !== ''; });
  if (!any && !sess.confirmEmpty) {
    sess.confirmEmpty = true;
    $('hint').hidden = false; $('hint').textContent = 'No numbers entered. Tap Complete again to mark it done anyway, or Skip.';
    this.lastChild.textContent = 'Complete anyway';
    return;
  }
  sess.done.push(n); if (!any) d.comment = 'Done'; commit(n, false); next(); // a confirmed complete always reaches the sheet, so the training day is marked
};
document.addEventListener('change', function (e) {
  if (e.target.id === 'ciDate' && e.target.value) { ciState = { date: e.target.value, confirm: '', msg: '', warn: false }; renderLog(); }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'ciVal' && ciState.confirm) { ciState.confirm = ''; ciState.replace = false; ciState.msg = ''; ciState.warn = false; var sb = $('saveBtn'); if (sb) sb.querySelector('.st-idle').textContent = 'Save'; if ($('ciMsg')) { $('ciMsg').textContent = ''; $('ciMsg').className = ''; } }
  var f = e.target.dataset && e.target.dataset.f; if (!f || !sess || !sess.current) return;
  var d = draft(sess.current);
  var val = e.target.value; if (f === 'kg') val = val.replace(/^(\d+),(\d+)$/, '$1.$2');
  if (f === 'comment') d.comment = val; else d[f][+e.target.dataset.i] = val;
  saveSess();
  if (f !== 'comment') { var i = +e.target.dataset.i, p = prevOf(exByName(dayByName(sess.day), sess.current)), row = $('set' + i), was = row.classList.contains('beaten'), now = beats(p, i, d.kg[i], d.reps[i]);
    row.classList.toggle('beaten', now); if (now && !was) { row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); buzz(15); } }
});
document.addEventListener('keydown', function (e) { // Enter moves to the next box; on the last box it saves
  if (e.key !== 'Enter' || e.target.tagName === 'TEXTAREA') return;
  var inForm = e.target.closest('.screen > .form') || e.target.closest('.form'), inEx = e.target.closest('.ex');
  if (!inForm && !inEx) return;
  e.preventDefault();
  var all = Array.prototype.slice.call((inForm || inEx).querySelectorAll('input:not([type="date"]):not([type="file"])'));
  var nx = all[all.indexOf(e.target) + 1];
  if (nx) nx.focus(); else { e.target.blur(); if (inForm && $('saveBtn')) saveLog(); }
});

/* ---------- boot ---------- */
function boot() { if (data) resume(); refresh(); }
var refreshing = false;
function refresh() {
  if (refreshing) return; refreshing = true;
  var bootAt = Date.now();
  api.getData().then(function (fresh) {
    refreshing = false;
    if (data && lastWrite > bootAt) { fresh.checkIn = data.checkIn; fresh.tasks = data.tasks; fresh.measurements = data.measurements; } // a save landed after this snapshot was taken
    var first = !data; data = fresh; store('cw:data', data); fetchedOn = localIso(); fetchedAt = Date.now();
    if (data.savedTo) SAVED_TO = data.savedTo;
    if (data.title) document.title = data.title;
    loadPlan();
    if (first || TABS[view.screen]) resume();
    else if (view.screen === 'log' && !logDirty()) renderLog();
    flush();
  }, function (err) {
    refreshing = false;
    if (!data) $('app').innerHTML = '<div class="err"><b>Could not load your plan.</b>' + esc((err && err.message) || 'Check your signal and reopen the link.') + '</div>';
    else { syncState.error = 'offline'; renderSync(); }
  });
}
function resume() { var v = view.screen; if (!v || !TABS[v]) return show('today'); show(v); }
function onResume() { // a page left open overnight: new day, new data, but never under a half-typed form or an open session
  if (document.hidden || !data || !TABS[view.screen]) return;
  if (localIso() !== fetchedOn || Date.now() - fetchedAt > 6e5) refresh();
}
document.addEventListener('visibilitychange', onResume);
window.addEventListener('pageshow', function (e) { if (e.persisted) onResume(); });
boot();

function mockApi() { // public copy: a link without ?s and ?k has nothing to load
  return { getData: function () { return Promise.reject(new Error('This link is missing its details. Ask Adam for your workout link.')); } };
}
</script>
